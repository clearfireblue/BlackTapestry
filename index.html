<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark Tapestry</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dark Tapestry">
<meta name="theme-color" content="#4B4D3A">
<style>
/* VOICE: grim military satire, a field dossier on a desk.
   IDEA: a manila case file for a squad and the warship that drops it.
   PICTURE: portrait photos clipped to the squad sheet.
   COLOUR and TYPE: olive desk, manila folder, paper, carbon ink, red stamp; Arial throughout.
   LAYOUT: masthead, folder tabs, stacked paper sheets. */
:root{
  --desk:#4B4D3A; --desk-ink:#E9E4CB;
  --paper:#E4DFC6; --manila:#C8B27D; --manila-d:#A58E5A;
  --ink:#1B2230; --ink-soft:#4B505C; --carbon:#2C4C86; --stamp:#A3312B; --olive:#4F5E33; --amber:#8F5F14;
  --rule:#8E896F; --shadow:rgba(15,13,6,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#1C1F18; --desk-ink:#DDD8BF;
    --paper:#CFC9AE; --manila:#A99567; --manila-d:#877547;
    --ink:#161B26; --ink-soft:#40454F; --carbon:#26437A; --stamp:#98302A; --olive:#48562E; --amber:#85570F;
    --rule:#7C775F; --shadow:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --desk:#1C1F18; --desk-ink:#DDD8BF;
  --paper:#CFC9AE; --manila:#A99567; --manila-d:#877547;
  --ink:#161B26; --ink-soft:#40454F; --carbon:#26437A; --stamp:#98302A; --olive:#48562E; --amber:#85570F;
  --rule:#7C775F; --shadow:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--desk)}
body{
  margin:0;background:var(--desk);color:var(--ink);
  font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;line-height:1.55;
  min-height:100vh;
}
.app{max-width:920px;margin:0 auto;padding:14px 12px 48px}
h1,h2,h3{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-weight:700;margin:0;line-height:1.1;letter-spacing:.01em}
h1{font-size:clamp(30px,7vw,46px)}
h2{font-size:clamp(22px,4.4vw,28px);margin-bottom:8px}
h3{font-size:19px;margin-bottom:4px}
p{margin:0 0 12px;max-width:68ch}
button{font:inherit}
:focus-visible{outline:3px solid var(--carbon);outline-offset:2px}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 22px;color:var(--desk-ink);padding:6px 4px 10px}
.mast .brand{font-size:22px;font-weight:700}
.mast .meta{font-size:15px;opacity:.92;text-align:right}
.mom{display:flex;gap:2px;margin-top:6px;justify-content:flex-end}
.mom i{display:block;width:10px;height:12px;background:#0004;border:1px solid #E9E4CB55}
.mom i.on-pos{background:#8FA05A}
.mom i.on-neg{background:#C4574F}
.mom i.mid{border-color:#E9E4CB}

/* folder + tabs */
.tabs{display:flex;gap:4px;padding:0 8px;flex-wrap:wrap}
.tab{
  font-weight:700;font-size:16px;
  background:var(--manila-d);color:#241F10;border:0;padding:9px 18px 7px;border-radius:7px 7px 0 0;cursor:pointer;min-height:40px;
}
.tab[aria-selected="true"]{background:var(--manila)}
.folder{background:var(--manila);padding:14px;border-radius:0 7px 7px 7px;box-shadow:0 14px 34px var(--shadow)}
.sheet{
  background-color:var(--paper);
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .3 0 0 0 0 .27 0 0 0 0 .18 0 0 0 .09 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  padding:24px clamp(16px,4vw,36px);margin:0 0 14px;border-radius:2px;
  box-shadow:0 2px 5px var(--shadow);
}
.sheet:last-child{margin-bottom:0}
.sheet.tilt{transform:rotate(-.25deg)}
.rule{border:0;border-top:2px solid var(--ink);margin:14px 0}
.rule.thin{border-top:1px dashed var(--rule)}
.hand{color:var(--carbon);font-style:italic}
.muted{color:var(--ink-soft)}

/* form fields */
.form{display:grid;grid-template-columns:minmax(0,11ch) minmax(0,1fr);gap:0;border-top:2px solid var(--ink);margin:12px 0 16px}
.form dt,.form dd{margin:0;padding:7px 4px;border-bottom:1px solid var(--rule)}
.form dt{color:var(--ink-soft);font-size:15px}
.form dd{color:var(--carbon);font-weight:700}
@media (max-width:520px){.form{grid-template-columns:1fr}.form dt{border-bottom:0;padding-bottom:0}}

/* stamp */
.stamp{
  display:inline-block;font-weight:700;
  font-size:clamp(24px,6vw,38px);line-height:1;color:var(--stamp);border:4px solid var(--stamp);
  padding:8px 14px;transform:rotate(-5deg);mix-blend-mode:multiply;opacity:.93;border-radius:4px;margin:16px 0 18px;
}
.stamp.ok{color:var(--olive);border-color:var(--olive)}
.stamp.mid{color:var(--amber);border-color:var(--amber)}
@media (prefers-reduced-motion:no-preference){
  .stamp.thunk{animation:thunk .5s cubic-bezier(.2,.9,.3,1.15) both}
}
@keyframes thunk{
  0%{transform:rotate(-5deg) scale(2.3);opacity:0}
  65%{transform:rotate(-5deg) scale(.95);opacity:1}
  100%{transform:rotate(-5deg) scale(1)}
}

/* buttons */
.btn{
  display:inline-block;background:var(--ink);color:#EFEAD2;border:2px solid var(--ink);
  font-weight:700;font-size:17px;
  padding:10px 22px;cursor:pointer;border-radius:2px;margin:6px 8px 6px 0;min-height:44px;
}
.btn:hover{background:#2A3346}
.btn.alt{background:transparent;color:var(--ink)}
.btn.alt:hover{background:#1B223014}
.btn.small{font-size:15px;padding:6px 14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opt{
  display:block;width:100%;text-align:left;background:transparent;border:2px solid var(--ink);color:var(--ink);
  padding:12px 14px 12px;margin:10px 0;cursor:pointer;border-radius:2px;position:relative;
}
.opt:hover{background:#1B22301A}
.opt b{display:block;font-size:18px;padding-right:130px}
.opt .sub{color:var(--ink-soft);display:block;max-width:60ch}
.opt .tag{position:absolute;right:10px;top:12px;font-size:13px;border:1px solid var(--ink-soft);color:var(--ink-soft);padding:0 6px}
.opt.util{border-style:dashed;border-width:1px}
.opt.util b{font-size:16px}
.optwrap{border:2px solid var(--ink);margin:10px 0;border-radius:2px}
.optwrap.util{border-style:dashed;border-width:1px}
.optwrap .opt{border:0;margin:0}
.optwrap details{padding:0 14px 10px;border-top:1px dashed var(--rule)}
.optwrap summary{cursor:pointer;font-size:15px;color:var(--ink-soft);padding:8px 0 2px}
.optwrap ul{margin:6px 0 0;padding-left:20px;font-size:15px}
.optwrap li{margin-bottom:3px}
.tablewrap{overflow-x:auto;max-width:100%}
table.squad{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
table.squad th,table.squad td{border:1px solid var(--rule);padding:7px 9px;text-align:left;vertical-align:top}
table.squad thead th{background:#1B22301A;font-size:16px}
table.squad tbody th{background:var(--paper);font-weight:700;white-space:nowrap;position:sticky;left:0}
table.squad td.dead{color:var(--ink-soft);text-decoration:line-through}
@media (max-width:520px){.opt b{padding-right:0}.opt .tag{position:static;display:inline-block;margin-top:6px}}

/* portraits, ship, requisition */
.pf{display:block;width:96px;height:128px;object-fit:cover;border:1px solid var(--ink-soft);background:#0002;box-shadow:0 2px 4px var(--shadow);transform:rotate(-1deg)}
.pf.sm{width:72px;height:96px}
table.squad thead th .pf{margin:0 0 6px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;margin:8px 0 4px}
.offer{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start}
.owned{color:var(--olive);font-weight:700;margin:6px 0 0}
.edge{font-weight:700;color:var(--carbon)}
.rp{font-weight:700;color:var(--amber)}

/* status strips */
.strip{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:8px 0;margin:0 0 14px;font-size:14px}
.boxes{display:inline-flex;gap:3px;vertical-align:middle}
.boxes i{display:block;width:16px;height:16px;border:2px solid var(--ink)}
.boxes i.on{background:var(--ink)}
.chip{display:inline-block;border:1px solid var(--ink-soft);padding:0 7px;font-size:14px;margin:0 6px 4px 0;white-space:nowrap}
.chip.fine{color:var(--olive);border-color:var(--olive)}
.chip.bloodied{color:var(--amber);border-color:var(--amber)}
.chip.crippled{color:var(--stamp);border-color:var(--stamp);font-weight:700}
.chip.scarred{color:#fff;background:var(--stamp);border-color:var(--stamp);font-weight:700}
.chip.dead{text-decoration:line-through;color:var(--ink-soft)}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.card{border:1px solid var(--ink-soft);padding:10px 12px;background:#FFFFFF12}
.card.dead{opacity:.6}
.card small{display:block;color:var(--ink-soft)}

/* log */
.log{font-size:16px;line-height:1.5}
.log p{margin:0 0 3px;max-width:none}
.log .h{font-size:22px;font-weight:700;margin:2px 0 8px}
.log .r{margin-top:14px;padding-top:6px;border-top:1px dashed var(--rule);font-weight:700}
.log .hit{color:var(--carbon)}
.log .miss{color:var(--ink-soft)}
.log .bad{color:var(--stamp);font-weight:700}
.log .note{font-style:italic}
.log .chk{font-weight:700}
.log .clue{color:var(--olive);font-weight:700}
.log .secret{border:2px solid var(--olive);color:var(--olive);padding:8px 10px;margin:10px 0;font-weight:700}
.log .good{font-weight:700}
.story{border-left:3px solid var(--ink);padding-left:14px;margin:0 0 16px}

.badge{display:inline-block;font-weight:700;font-size:14px;border:2px solid var(--carbon);color:var(--carbon);padding:0 8px;margin-right:8px;transform:rotate(-1.5deg)}
.badge.alt{border-color:var(--amber);color:var(--amber)}
.badge.int{border-color:var(--stamp);color:var(--stamp)}
.redact{display:inline-block;background:var(--ink);color:var(--ink);user-select:none;padding:0 4px}
.foot{color:var(--desk-ink);opacity:.85;font-size:14px;margin-top:14px;text-align:center}
ul.plain{margin:0 0 12px;padding-left:20px}
ul.plain li{margin-bottom:4px}
details summary{cursor:pointer;font-weight:700}
.sel{font:inherit;font-size:16px;min-height:40px;max-width:100%;margin:0 6px}
.log .h3{font-weight:700;margin-top:8px}
.bar label{font-size:14px}
.gearlink{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.picklist{margin-top:6px;border:1px solid var(--ink-soft);background:var(--paper)}
.pickopt{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:8px;font:inherit;font-size:15px;cursor:pointer;min-height:40px;color:var(--ink)}
.pickopt:hover{background:#1B22301A}
.pickopt:last-child{border-bottom:0}
.gearsel{display:block;width:100%;margin-top:6px;font:inherit;font-size:14px;min-height:36px;padding:4px;border:1px solid var(--ink-soft);border-radius:2px;background:var(--paper);color:var(--ink)}
.gearwrap{position:relative;display:inline-block;min-width:3em}
.gearwrap.pickable{cursor:pointer}
.gearpick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
#tip{position:fixed;z-index:50;display:none;max-width:240px;background:var(--ink);color:#EFEAD2;font-size:14px;line-height:1.4;padding:8px 10px;border-radius:3px;box-shadow:0 4px 12px var(--shadow)}
.dragcol{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.dragcol img{pointer-events:none;-webkit-user-drag:none}
.dragcol.dragging{opacity:.55;cursor:grabbing}
.dragcol.droptarget{outline:3px dashed var(--carbon);outline-offset:-3px}
.draghint{display:block;font-size:12px;font-weight:400;color:var(--ink-soft)}
.dtsel{display:block;width:100%;margin:6px 0;font-size:15px}
.armlist{list-style:none;margin:8px 0 0;padding:0;border-top:2px solid var(--ink)}
.armlist li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;padding:6px 2px;border-bottom:1px solid var(--rule);font-size:15px}
.armname{flex:1 1 180px;min-width:0}
.armact{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.sel.mini{font-size:14px;min-height:34px;margin:0;max-width:120px}
button.mini{font:inherit;font-size:14px;font-weight:700;min-height:34px;padding:2px 10px;border:2px solid var(--ink);background:var(--ink);color:#EFEAD2;border-radius:2px;cursor:pointer}
button.mini.alt{background:transparent;color:var(--ink)}
.gdesc{display:block;font-size:13px;line-height:1.35;color:var(--ink-soft);margin-top:2px}
</style>
</head>

</div>

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rollIdx(idx){if(idx<-1)return 1;if(idx<0)return rnd(2);if(idx<=4)return rnd([4,6,8,10,12][idx]);return rnd(12)+2*(idx-4);}
function maxIdx(idx){if(idx<-1)return 1;if(idx<0)return 2;if(idx<=4)return [4,6,8,10,12][idx];return 12+2*(idx-4);}
function parseDie(s){return String(s).split(',').map(function(p){p=p.trim();var m=/^d(\d+)([+-]\d+)?$/.exec(p);return m?{d:+m[1],m:m[2]?+m[2]:0}:{d:0,m:+p};});}

function unitOf(str,fac){var p=str.split('|');return {name:p[0],fac:fac,threat:+p[1],troops:+p[2],max:+p[2],die:p[3],spec:parseDie(p[3]),armor:+(p[4]||0),ia:+(p[5]||0)};}

/* ================= squads ================= */
function usedPf(){var u={};G.squads.forEach(function(s){u[s.pf]=1;});(G.offers||[]).forEach(function(o){u[o.s.pf]=1;});return u;}

}
function uniqueCall(){

function sqName(s){return s.call;}
function fullName(s){return (isLt(s)?'Lt. ':'Sgt. ')+s.first+' "'+s.call+'" '+s.last;}

function available(){return G.squads.filter(function(s){return !s.lost&&s.out<=0;});}

function itemDef(it){if(!it)return null;return ({weapon:WEAPONS,armor:ARMORS,artifact:ARTIFACTS,orbital:ORBITALS,specialty:SPECS})[it.k][it.i];}
function mods(s){
  var m={arm:0,cs:0,tr:0,fr:0,po:0,rg:0,oc:0};
  ['armor','artifact','specialty'].forEach(function(k){var d=itemDef(s.gear[k]);if(!d||!d.m)return;for(var x in d.m){if(typeof d.m[x]==='number')m[x]=(m[x]||0)+d.m[x];else m[x]=d.m[x];}});
  var w=itemDef(s.gear.weapon);if(w)m.cs+=w.r;

}
function stat(s,k){

  if(k==='arm')return Math.max(0,s.arm+m.arm+(c.arm||0)-(G.mission&&G.mission.heat?2:0));
  if(k==='po')return s.po+m.po;
  if(k==='fr')return Math.max(0,s.fr+m.fr+(c.fr||0));
  if(k==='tr')return Math.max(1,s.tr+m.tr+(s.uav||0));
  if(k==='rg')return m.rg+(hasUp('pods')?1:0);

}
function ignoreArmor(s){
  var m=mods(s),c=s.c||{},n=(m.iaFlat||0)+(c.iaFlat||0);

}
function rollPotency(s){

function rollCombat(s){var c=s.c||{};return rollIdx(stat(s,'cs'))+(mods(s).c2?rnd(4):0)+(c.flat||0);}
function addCons(name,n,L){
  n=n||1;

function randomCons(){var pool=CONS.filter(function(c){return c.n!=='DEET'||(G.mission&&G.mission.fac==='Kaiju');});return pick(pool).n;}

/* ================= loot ================= */
function randomItem(k,unique){
  if(k==='weapon'){var r=clamp(rnd(3)+(G.campaign.stage>=2?1:0)+(unique?1:0),1,5);var pool=WEAPONS.map(function(w,i){return i;}).filter(function(i){return WEAPONS[i].r===r&&!WEAPONS[i].issue;});return {k:k,i:pick(pool)};}
  if(k==='armor'){var r2=clamp(rnd(3)+(G.campaign.stage>=2?1:0)+(unique?1:0),1,5);var p2=ARMORS.map(function(a,i){return i;}).filter(function(i){return ARMORS[i].r===r2;});return {k:k,i:pick(p2)};}
  if(k==='artifact'){var p3=ARTIFACTS.map(function(a,i){return i;}).filter(function(i){return unique?!!ARTIFACTS[i].q:!ARTIFACTS[i].q;});return {k:k,i:pick(p3)};}
  if(k==='orbital')return {k:k,i:rnd(ORBITALS.length)-1};
  return {k:'specialty',i:rnd(SPECS.length)-1};
}
function itemRank(it){var d=itemDef(it);return d&&d.r?d.r:0;}
/* Treasure goes to the Lieutenant first, then down the line; otherwise into the hold. */
function stow(it,L){
  var d=itemDef(it),dep=deployed().concat(available().slice(4));
  for(var i=0;i<dep.length;i++){
    var s=dep[i],cur=s.gear[it.k];
    if(!cur){s.gear[it.k]=it;L&&L.push({c:'good',t:'Issued to '+sqName(s)+': '+d.n+'.'});return;}
    if((it.k==='weapon'||it.k==='armor')&&itemRank(it)>itemRank(cur)){
      s.gear[it.k]=it;G.hold.push(cur);
      L&&L.push({c:'good',t:sqName(s)+' swaps up to the '+d.n+'. The '+itemDef(cur).n+' goes to the armory.'});return;
    }
  }
  G.hold.push(it);L&&L.push({c:'good',t:d.n+' goes to the armory.'});
}
function equip(holdIdx,sid){
  var it=G.hold[holdIdx],s=G.squads.filter(function(x){return x.id===sid;})[0];if(!it||!s||s.lost)return;
  var cur=s.gear[it.k];G.hold.splice(holdIdx,1);s.gear[it.k]=it;if(cur&&!(cur.k==='weapon'&&WEAPONS[cur.i].issue&&false))G.hold.push(cur);
  s.troops=Math.min(s.troops,stat(s,'tr'));
  pushLog(sqName(s)+' is issued the '+itemDef(it).n+'.');
}
function unequip(sid,k){
  var s=G.squads.filter(function(x){return x.id===sid;})[0];if(!s||!s.gear[k])return;
  if(k==='weapon'&&WEAPONS[s.gear.weapon.i].issue)return;
  G.hold.push(s.gear[k]);s.gear[k]=null;if(k==='weapon')s.gear.weapon={k:'weapon',i:pick(ISSUE)};
  s.troops=Math.min(s.troops,stat(s,'tr'));
}

/* ================= campaign ================= */
function newCampaign(){
  G=freshG();
  G.campaign={missionNo:0,stage:0,momentum:0,since:0,esc:0,renown:6,won:0,part:0,lost:0,threatNext:0,streak:0,ship:{name:'SD '+pick(SHIPNAMES),up:{}}};
  for(var i=0;i<4;i++)G.squads.push(newSquad('conscript'));
  addCons('Frag Grenade',1);addCons('Biofoam Stimulant',1);
  G.phase='ship';genOffers();
  pushLog('A new platoon reports aboard the '+G.campaign.ship.name+'. Four squads. Nobody asked for them.');
  save();
}
function planetName(){return pick(PLANET_A)+'-'+pick(PLANET_B)+' '+pick(NUMERALS);}
function genPlanning(){
  var C=G.campaign,n=3+(hasUp('bridge')?1:0),opts=[];
  var lo=clamp(C.stage-1,0,3),hi=clamp(C.stage+1,1,4);
  for(var i=0;i<n;i++){
    var o=rnd(6)-1;
    opts.push({planet:planetName(),biome:rnd(BIOMES.length)-1,fac:pick(FACTION_ORDER.slice(0,Math.min(6,3+C.stage))),obj:o,sub:rnd(6)-1,len:rnd(3)-1,diff:lo+rnd(hi-lo+1)-1});
  }
  if(!opts.some(function(o){return o.diff<=C.stage;}))opts[0].diff=Math.max(0,C.stage-1);
  G.planning={options:opts};
}
function startMission(i){
  var o=G.planning.options[i];if(!o)return;
  var C=G.campaign;
  deployed().forEach(function(s){s.c={};s.timer=0;s.scarsM=0;s.psychM=0;s.brink=false;s.uav=0;s.luckUsed=false;s.waryUsed=false;s.troops=stat(s,'tr');});
  var B=BIOMES[o.biome];
  G.mission={planet:o.planet,biome:o.biome,fac:o.fac,obj:o.obj,sub:o.sub,len:o.len,diff:o.diff,need:o.len+1,adv:0,sites:0,
    heat:B.h==='heat',routes:null,site:null,done:false,edges:[],notices:[],loot:[],kills:0,extraT:C.threatNext,
    brief:{officer:pick(OFFICERS),open:pick(OPENERS),close:pick(CLOSERS),stage:STAGES[C.stage].r}};
  C.threatNext=0;
  G.phase='briefing';G.report=null;G.debrief=null;G.combat=null;
  pushLog('Mission '+(C.missionNo+1)+': '+OBJECTIVES[o.obj][0]+' on '+o.planet+' against '+o.fac+' ('+LENGTHS[o.len]+', '+DIFFS[o.diff]+').');
  save();
}
function deploy(){G.phase='route';genRoutes(true);save();}
function genRoutes(first){
  var m=G.mission,n;
  var r=rnd(6);
  if(first)n=r===1?1:(r<=4?2:3);else n=r<=3?1:2;
  m.routes=[];
  for(var i=0;i<n;i++){var roll;do{roll=rnd(6)+rnd(6);}while(roll===2);m.routes.push({roll:roll,loc:pick(SITE_LOCS)});}
}
function routeHint(rt){
  var t=TOKENS[G.mission.diff][rt.roll-2];
  var threat=t===0?'No movement on the scanners':(t<=3?'Light movement':(t<=8?'Heavy movement':'The scanner gives up and shows a frowning face'));
  var loot=rt.roll===12?'a clear path toward the objective':(rt.roll===7?'nothing of interest':(rt.roll===6?'unstable ground':(rt.roll<=5||rt.roll>=10?'something valuable':'supply crates')));
  return threat+'; sensors suggest '+loot+'.';
}
function tickTimers(rounds){
  deployed().forEach(function(s){for(var i=0;i<rounds;i++){if(s.timer>0)s.timer=Math.max(0,s.timer-Math.max(1,stat(s,'fr'))-(hasUp('battery')?1:0));}});
}
function takeRoute(i){
  var m=G.mission,rt=m.routes[i];if(!rt)return;
  m.sites++;tickTimers(1);
  var roll=rt.roll;
  if(m.sites>6&&roll!==12){roll=12;}
  m.site={roll:roll,loc:rt.loc,title:SITE[roll]};
  var L=[{c:'h',t:'Site '+m.sites+': '+rt.loc+(m.sites>6?' (the platoon pushes straight for the objective)':'')},{c:'note',t:'Site roll 2d6: '+rt.roll+' — '+SITE[rt.roll]+'.'}];
  var tokens=TOKENS[m.diff][roll-2]+(roll!==12?m.extraT:0);
  var lastAdvance=(roll===12&&m.adv+1>=m.need);
  if(lastAdvance)tokens=Math.max(tokens,TOKENS[m.diff][10])+2;
  m.pendingSite={roll:roll,L:L,lastAdvance:lastAdvance};
  if(roll===6)hazard(L);
  if(tokens>0&&alive().length){startCombat(tokens,L,lastAdvance);}
  else finishSite();
  save();
}
function alive(){return deployed().filter(function(s){return !s.brink&&s.troops>0;});}
function hazard(L){
  var m=G.mission,B=BIOMES[m.biome],h=B.h;
  L.push({c:'note',t:'Hazard: '+B.t});
  deployed().forEach(function(s){
    if(s.brink)return;
    if(s.edge==='hardened'&&h&&/dmg|rad|gas/.test(h)){L.push({c:'good',t:sqName(s)+' is Hardened and walks through it.'});return;}
    var dmg=0;
    if(h==='dmg6')dmg=Math.max(0,rnd(6)-stat(s,'arm'));
    else if(h==='dmg8')dmg=Math.max(0,rnd(8)-stat(s,'arm'));
    else if(h==='rad')dmg=rnd(4);
    else if(h==='gas'){var p=rollPotency(s);if(p<3)dmg=Math.max(0,rnd(6)-stat(s,'arm'));L.push({c:'chk',t:sqName(s)+' rolls Potency '+p+(p<3?': fails.':': passes.')});}
    if(dmg>0)casualties(s,dmg,L,'the hazard');
  });
  if(h==='psych'){var t=pick(alive());if(t){t.psychM++;L.push({c:'bad',t:sqName(t)+' finds the place a little too pleasant. Psychological scar.'});}}
  if(!h)L.push({c:'note',t:'The terrain is miserable but nobody is hurt.'});
}
function finishSite(){
  var m=G.mission,ps=m.pendingSite,L=ps.L,roll=ps.roll;
  if(!alive().length){wipe(L);return;}
  if(m.combatResult==='escaped'){L.push({c:'note',t:'The platoon slips away without searching the site.'});}
  else reward(roll,L);
  m.combatResult=null;
  if(roll===12){
    m.adv++;
    L.push({c:'good',t:'Advance toward the objective: '+m.adv+' of '+m.need+'.'});
    if(m.adv>=m.need){m.done=true;L.push({c:'good',t:'Objective complete: '+OBJECTIVES[m.obj][1][m.sub]+'.'});}
  }
  G.report={lines:L};G.combat=null;
  if(!m.done){var r=rnd(6);if(r===6&&m.sites>=1){m.routes=[{roll:12,loc:'the approach to the objective'}];}else genRoutes(false);}
  G.phase='route';
}
function reward(roll,L){
  var m=G.mission;
  if(roll===3)stow(randomItem(Math.random()<.5?'orbital':'specialty'),L);
  else if(roll===4)stow(randomItem('artifact',true),L);
  else if(roll===5)stow(randomItem(Math.random()<.5?'weapon':'armor',true),L);
  else if(roll===7)L.push({c:'note',t:'Empty. The squads take five minutes and pretend it was planned.'});
  else if(roll===8){addCons(randomCons(),1,L);addCons(randomCons(),1,L);}
  else if(roll===9)stow(randomItem(Math.random()<.67?'weapon':'armor'),L);
  else if(roll===10)stow(randomItem('artifact'),L);
  else if(roll===11)stow(randomItem(Math.random()<.5?'orbital':'specialty'),L);
}

/* ================= combat ================= */
function spawn(tokens,fac){
  var units=FACTIONS[fac].u.map(function(u){return unitOf(u,fac);}),out=[],left=tokens,guard=0;
  while(left>0&&guard++<40){
    var fit=units.filter(function(u){return u.threat<=left;});
    if(!fit.length)break;
    var top=Math.max.apply(null,fit.map(function(u){return u.threat;}));
    var pool=fit.filter(function(u){return u.threat>=Math.ceil(top/2);});
    var u=pick(pool.length?pool:fit);
    out.push(JSON.parse(JSON.stringify(u)));left-=u.threat;
  }
  out.forEach(function(e,i){e.id='e'+i;e.dot=0;e.dotN=0;e.sup=0;e.armMod=0;});
  return out;
}
function startCombat(tokens,L,boss){
  var m=G.mission,B=BIOMES[m.biome];
  var en=spawn(tokens,m.fac);
  if(B.h==='extra1'||B.h==='extra2'){var t=B.h==='extra1'?1:2;var add=spawn(t,m.fac);add.forEach(function(e,i){e.id='x'+i;});en=en.concat(add);}
  G.combat={en:en,allies:[],round:0,L:[],boss:boss,tokens:tokens,newReady:true,stall:{},over:null};
  deployed().forEach(function(s){s.c={};s.used={};s.negate=0;if(s.troops>0&&!s.brink)s.troops=Math.min(s.troops,stat(s,'tr'));});
  var C=G.combat;
  C.L.push({c:'h',t:(boss?'Objective force: ':'Contact: ')+tokens+' threat of '+m.fac});
  C.L.push({c:'note',t:en.map(function(e){return e.name+' ('+e.troops+' troops, '+e.die+(e.armor?', armor '+e.armor:'')+')';}).join('; ')+'.'});
  if(B.h==='stall'){alive().forEach(function(s){var p=rollPotency(s);if(p<3){C.stall[s.id]=1;C.L.push({c:'bad',t:sqName(s)+' rolls Potency '+p+' and loses the first round to the conditions.'});}});}
  G.phase='combat';
  pauseCheck();
}
function readyOrbital(s){return s.gear.orbital&&s.timer<=0&&!s.brink&&s.troops>0;}
function usable(){
  var out=[];
  alive().forEach(function(s){
    if(s.gear.orbital)out.push({t:'orb',s:s});
    ['armor','artifact'].forEach(function(k){var d=itemDef(s.gear[k]);if(d&&d.u&&!s.used[k])out.push({t:'use',s:s,k:k});});
  });
  return out;
}
function pauseCheck(){
  var C=G.combat;
  if(C.auto){C.pause=false;return;}
  var any=alive().some(function(s){return readyOrbital(s)||['armor','artifact'].some(function(k){var d=itemDef(s.gear[k]);return d&&d.u&&!s.used[k];});});
  C.pause=C.round===0?true:(C.newReady&&any);
  C.newReady=false;
}
function orbitalCost(s){
  var o=ORBITALS[s.gear.orbital.i],m=mods(s),c=6-stat(s,'fr')-(m.oc||0);
  if(m.smite&&(o.n==='Orbital Napalm Bombardment'||o.n==='Orbital Laser'))c-=3;
  if(BIOMES[G.mission.biome].h==='storm')c+=2;
  return Math.max(0,c);
}
function callOrbital(sid,force){
  var C=G.combat,s=findSq(sid);if(!C||C.over||!s||!s.gear.orbital||s.brink)return;
  var o=ORBITALS[s.gear.orbital.i],L=C.L,cost=orbitalCost(s);
  if(s.timer>0){if(!force)return;s.psychM++;s.timer+=cost;L.push({c:'bad',t:sqName(s)+' calls '+o.n+' while the Frequency Timer is still running. Psychological scar from the stress.'});}
  else s.timer=cost;
  L.push({c:'h2',t:sqName(s)+' calls '+o.n+'. Frequency Timer: '+s.timer+'.'});
  doFx(s,o.fx,o,L);
  afterAction();
}
function useItem(sid,k){
  var C=G.combat,s=findSq(sid);if(!C||C.over||!s||s.used[k])return;
  var d=itemDef(s.gear[k]);if(!d||!d.u)return;
  s.used[k]=1;C.L.push({c:'h2',t:sqName(s)+' uses the '+d.n+'.'});
  var u=d.u,L=C.L;
  if(u==='grenade')addCons(pick(GRENADES),1,L);
  else if(u==='grenade2'){addCons(pick(GRENADES),1,L);addCons(pick(GRENADES),1,L);}
  else if(u==='biofoam')addCons('Biofoam Stimulant',1,L);
  else if(u==='deet')addCons('DEET',1,L);
  else if(u==='milk')addCons('Auroch Milk',1,L);
  else if(u==='laser')doFx(s,'strike3',{a:'OP'},L);
  else if(u==='napalm')doFx(s,'strike3',{a:'OP/2'},L);
  else if(u==='cement2')doFx(s,'cement',{a:'OP',c:2},L);
  else if(u==='cement4')doFx(s,'cement',{a:'OP',c:4},L);
  else if(u==='strike1')doFx(s,'strike1',{a:'OP'},L);
  else if(u==='strike1x2')doFx(s,'strike1',{a:'OP*2'},L);
  else if(u==='inflate')doFx(s,'inflate',{a:'OP*2'},L);

  else if(u==='maxpo'){s.c.maxpo=1;L.push({c:'good',t:sqName(s)+'’s next Potency roll will be its maximum.'});}

}
function useCons(name,sid){
  var C=G.combat,s=findSq(sid);if(!C||C.over||!s||s.brink||!(G.cons[name]>0))return;
  var d=CONS.filter(function(c){return c.n===name;})[0];

  var L=C.L,fx=d.fx;
  if(fx==='buff'){for(var x in d.m){if(typeof d.m[x]==='number')s.c[x]=(s.c[x]||0)+d.m[x];else s.c[x]=d.m[x];}L.push({c:'good',t:d.d});}
  else if(fx==='heal8'){var h=mods(s).biofoam?16:8;heal(s,h,L);}
  else if(fx==='calibrate'){s.timer=Math.max(0,s.timer-6);L.push({c:'good',t:'Frequency Timer is now '+s.timer+'.'});}
  else if(fx==='maxpo'){s.c.maxpo=1;L.push({c:'good',t:'The next Potency roll will be its maximum.'});}
  else if(fx==='negate'){s.negate++;L.push({c:'good',t:'The next casualties will be negated.'});}
  else if(fx==='deet'){s.c.deet=1;L.push({c:'good',t:G.mission.fac==='Kaiju'?'The Kaiju recoil. '+sqName(s)+' rolls an automatic 12 next round.':'The enemy is unbothered by insect repellent.'});}
  else if(fx==='animatronic1'){addAlly('Animatronic|1|6|d4-2',L);}
  else if(fx==='napalm')doFx(s,'strike3',{a:'OP/2'},L);
  else if(fx==='cement2')doFx(s,'cement',{a:'OP',c:2},L);
  else if(fx==='rail')doFx(s,'rail',{a:'OP/2'},L);
  else doFx(s,fx,{a:fx==='uav'||fx==='gas'?'OP/2':(fx==='inflate'?'OP*2':'OP')},L);

}
function afterAction(){
  var C=G.combat;

  save();
}
function amount(s,a,L){
  var r=rollPotency(s),v=a==='OP/2'?Math.ceil(r/2):(a==='OP*2'?r*2:r);
  L.push({c:'chk',t:'Potency roll ('+dieLabel(stat(s,'po'))+'): '+r+(a!=='OP'?' → '+v:'')+'.'});
  return v;
}
function liveEn(){return G.combat.en.filter(function(e){return e.troops>0;});}
function hurtEnemy(e,n,L,ignore){
  var a=Math.max(0,e.armor-e.armMod-(ignore||0));var dmg=Math.max(0,n-a);
  e.troops=Math.max(0,e.troops-dmg);G.mission.kills+=Math.min(dmg,n);
  L.push({c:dmg?'hit':'miss',t:e.name+' loses '+dmg+(a&&n?' ('+a+' armor)':'')+'.'+(e.troops<=0?' Destroyed.':'')});
}
function doFx(s,fx,o,L){
  var C=G.combat,ign=hasUp('targeting')?1:0;
  if(fx==='strike1'){var v=amount(s,o.a,L),e=liveEn().sort(function(a,b){return b.troops-a.troops;})[0];if(e)hurtEnemy(e,v,L,ign);}
  else if(fx==='strike3'){var v3=amount(s,o.a,L);liveEn().sort(function(a,b){return b.troops-a.troops;}).slice(0,3).forEach(function(e){hurtEnemy(e,v3,L,ign);});}
  else if(fx==='gas'){var g=amount(s,o.a,L),ge=liveEn().sort(function(a,b){return (b.armor-b.armMod)-(a.armor-a.armMod);})[0];if(ge){ge.armMod+=g;L.push({c:'good',t:ge.name+' loses '+g+' armor this combat.'});}}
  else if(fx==='gatling'){var gv=amount(s,o.a,L),gt=liveEn().sort(function(a,b){return b.troops-a.troops;})[0];if(gt){gt.dot=gv;gt.dotN=3;hurtEnemy(gt,gv,L,ign);gt.dotN=2;}}
  else if(fx==='rail'){var rv=amount(s,o.a,L),rt=liveEn().filter(function(e){return e.threat<=rv;}).sort(function(a,b){return b.threat-a.threat;})[0];if(rt){rt.troops=0;L.push({c:'hit',t:rt.name+' is removed from the fight.'});}else L.push({c:'miss',t:'Nothing small enough to remove. The shot craters an empty field.'});}
  else if(fx==='cement'){var cv=amount(s,o.a,L),ct=liveEn().filter(function(e){return e.threat<=cv;}).sort(function(a,b){return b.threat-a.threat;}).slice(0,o.c||2);ct.forEach(function(e){e.sup=1;});L.push({c:ct.length?'good':'miss',t:ct.length?ct.map(function(e){return e.name;}).join(' and ')+' are cemented in place this round.':'Nothing small enough to cement.'});}
  else if(fx==='inflate'){var iv=amount(s,o.a,L);s.troops+=iv;s.c.extra=(s.c.extra||0)+iv;L.push({c:'good',t:sqName(s)+' gains '+iv+' inflatable troops this combat.'});}
  else if(fx==='heal'){var hv=amount(s,o.a,L);heal(s,mods(s).biofoam?hv*2:hv,L);}
  else if(fx==='uav'){var uv=amount(s,o.a,L);s.uav=(s.uav||0)+uv;s.troops+=uv;L.push({c:'good',t:sqName(s)+' gains '+uv+' troops for the rest of the mission.'});}
  else if(fx==='escape'){var ev=amount(s,'OP',L),top=Math.max.apply(null,liveEn().map(function(e){return e.threat;}));if(ev>=top){L.push({c:'good',t:'The platoon breaks contact and is safe, for now.'});endCombat('escaped');}else L.push({c:'bad',t:'Not enough. The enemy ('+top+' threat) keeps pressing.'});}
  else if(fx==='shield'){var sv=amount(s,o.a,L);s.c.arm=(s.c.arm||0)+sv;L.push({c:'good',t:sqName(s)+' gains '+sv+' armor this combat.'});}
  else if(fx==='ally'){var av=amount(s,o.a,L),th=o.t.filter(function(x){return av<=x[0];})[0][1];addAlly(ALLIES[th-1],L);}
  else if(fx==='allies'){var nv=amount(s,o.a,L),cnt=o.t.filter(function(x){return nv<=x[0];})[0][1];for(var i=0;i<cnt;i++)addAlly('Holophase Trooper|1|4|d4',L,true);L.push({c:'good',t:cnt+' holophase troopers join the fight.'});}
  else if(fx==='animatronic'){var mv=amount(s,o.a,L),an=o.t.filter(function(x){return mv<=x[0];})[0][1];for(var j=0;j<an;j++)addAlly('Animatronic|1|6|d4-2',L,true);L.push({c:'good',t:an+' dubious animatronics join the fight.'});}
  else if(fx==='supply'){var pv=amount(s,o.a,L),k=o.t.filter(function(x){return pv<=x[0];})[0][1];for(var q=0;q<k;q++)addCons(randomCons(),1,L);}
}
function heal(s,n,L){var mx=stat(s,'tr')+((s.c&&s.c.extra)||0),b=s.troops;s.troops=Math.min(mx,s.troops+n);L.push({c:'good',t:sqName(s)+' recovers '+(s.troops-b)+' troops ('+s.troops+').'});}
function addAlly(str,L,quiet){var a=unitOf(str,'ally');a.id='a'+(G.combat.allies.length);G.combat.allies.push(a);if(!quiet)L.push({c:'good',t:a.name+' ('+a.troops+' troops, '+a.die+') joins the platoon.'});}
function findSq(id){id=+id;return G.squads.filter(function(s){return s.id===id;})[0];}
function casualties(s,n,L,src){
  if(n<=0)return 0;
  if(s.negate>0){s.negate--;L.push({c:'good',t:sqName(s)+' blinks out of the way. No casualties.'});return 0;}
  if(s.edge==='wary'&&!s.waryUsed){s.waryUsed=true;L.push({c:'good',t:sqName(s)+' sees it coming. [Edge: Battle-wary]'});return 0;}
  s.troops=Math.max(0,s.troops-n);
  L.push({c:'bad',t:sqName(s)+' takes '+n+' casualt'+(n===1?'y':'ies')+(src?' from '+src:'')+' ('+s.troops+' left).'});
  if(s.troops<=0&&!s.brink){s.brink=true;s.scarsM++;L.push({c:'bad',t:fill(pick(BRINK_LINES),{s:sqName(s)})+' Scarred.'});}
  return n;
}
function fightRound(){
  var C=G.combat,m=G.mission,L=C.L;if(!C||C.over)return;
  C.round++;
  L.push({c:'r',t:'Round '+C.round});
  liveEn().forEach(function(e){if(e.dotN>0&&e.dot>0){hurtEnemy(e,e.dot,L);e.dotN--;}});
  var friends=C.allies.filter(function(a){return a.troops>0;}).map(function(a){return {t:'a',a:a};})
    .concat(alive().filter(function(s){return !(C.round===1&&C.stall[s.id]);}).map(function(s){return {t:'s',s:s};}));
  var en=liveEn(),engaged={};
  var cold=C.round===1&&BIOMES[m.biome].h==='cold'?1:0;
  function fRoll(f){if(f.t==='a')return rollSpec(f.a.spec);var s=f.s;if(s.c.deet&&m.fac==='Kaiju'){s.c.deet=0;return 12;}return rollCombat(s);}
  function fArm(f){return f.t==='a'?f.a.armor:stat(f.s,'arm');}
  function fName(f){return f.t==='a'?f.a.name:sqName(f.s);}
  function fHurt(f,n,src){if(f.t==='a'){var d=Math.max(0,n);f.a.troops=Math.max(0,f.a.troops-d);L.push({c:'bad',t:f.a.name+' takes '+d+(f.a.troops<=0?' and is gone.':'.')});}else casualties(f.s,n,L,src);}
  function fIgn(f){return f.t==='a'?0:ignoreArmor(f.s)+(hasUp('targeting')?0:0);}
  function exchange(f,e,enemyRolls){
    if(e.troops<=0)return;
    var fr=fRoll(f),er=enemyRolls?rollSpec(e.spec)+cold:0;
    var lucky=f.t==='s'&&f.s.edge==='lucky'&&!f.s.luckUsed;
    if(lucky&&er>fr){f.s.luckUsed=true;var r2=fRoll(f);L.push({c:'note',t:fName(f)+' rolls '+fr+' and rerolls on luck: '+r2+'. [Edge: Lucky]'});fr=r2;}
    var line=fName(f)+' '+fr+' vs '+e.name+' '+(enemyRolls?er:'(suppressed)');
    if(fr>er){
      L.push({c:'hit',t:line+'.'});
      hurtEnemy(e,fr,L,fIgn(f));
      if(enemyRolls){var back=Math.ceil(er/2);var cut=Math.max(0,back-fArm(f));if(cut>0)fHurt(f,cut,e.name);}
    }else if(er>fr){
      L.push({c:'miss',t:line+'.'});
      var cas=Math.max(0,er-Math.max(0,fArm(f)-e.ia));if(cas>0)fHurt(f,cas,e.name);else L.push({c:'note',t:'Armor holds.'});
      var back2=Math.ceil(fr/2);hurtEnemy(e,back2,L,fIgn(f));
    }else L.push({c:'note',t:line+'. A stalemate.'});
  }
  friends.forEach(function(f,i){
    var tgts=liveEn();if(!tgts.length)return;
    if(f.t==='s'&&!(f.s.troops>0&&!f.s.brink))return;
    var e=tgts[i%tgts.length];
    var rolls=!e.sup&&!engaged[e.id];engaged[e.id]=1;
    exchange(f,e,rolls);
  });
  liveEn().forEach(function(e){
    if(engaged[e.id]||e.sup)return;
    var tg=friends.filter(function(f){return f.t==='a'&&f.a.troops>0;});
    if(!tg.length)tg=friends.filter(function(f){return f.t==='s'&&f.s.troops>0&&!f.s.brink;});
    if(!tg.length)return;
    var f=pick(tg);engaged[e.id]=1;
    var er=rollSpec(e.spec)+cold,fr=fRoll(f);
    L.push({c:'miss',t:e.name+' attacks '+fName(f)+': '+er+' vs '+fr+'.'});
    if(er>fr){var cas=Math.max(0,er-Math.max(0,fArm(f)-e.ia));if(cas>0)fHurt(f,cas,e.name);else L.push({c:'note',t:'Armor holds.'});hurtEnemy(e,Math.ceil(fr/2),L,fIgn(f));}
    else if(fr>er){hurtEnemy(e,fr,L,fIgn(f));var b=Math.max(0,Math.ceil(er/2)-fArm(f));if(b>0)fHurt(f,b,e.name);}
  });
  C.en.forEach(function(e){e.sup=0;});
  alive().forEach(function(s){var r=stat(s,'rg');if(r>0&&s.troops>0){var mx=stat(s,'tr')+(s.c.extra||0);var b=s.troops;s.troops=Math.min(mx,s.troops+r);if(s.troops>b)L.push({c:'good',t:sqName(s)+' reinforces '+(s.troops-b)+'.'});}});
  var wasReady={};deployed().forEach(function(s){wasReady[s.id]=readyOrbital(s);});
  tickTimers(1);
  deployed().forEach(function(s){if(!wasReady[s.id]&&readyOrbital(s))C.newReady=true;});
  if(!liveEn().length){endCombat('cleared');return;}
  if(!alive().length){endCombat('wiped');return;}
  if(C.round>=12){L.push({c:'note',t:'After twelve rounds the enemy melts back into the terrain.'});endCombat('withdrew');return;}
  pauseCheck();
}
function runAuto(){var C=G.combat;if(!C)return;C.auto=true;var g=0;while(!C.over&&g++<20)fightRound();save();}
function runUntilPause(){var C=G.combat,g=0;if(!C)return;do{fightRound();g++;}while(!C.over&&!C.pause&&g<20);save();}
function endCombat(res){
  var C=G.combat,m=G.mission;if(C.over)return;
  C.over=res;
  deployed().forEach(function(s){if(s.c&&s.c.extra){s.troops=Math.max(s.brink?0:1,Math.min(s.troops,stat(s,'tr')));}s.c={};s.used={};});
  if(res!=='wiped'){deployed().forEach(function(s){if(s.brink){s.brink=false;s.troops=1;C.L.push({c:'note',t:sqName(s)+' regains consciousness with 1 trooper. The scar stays.'});}});}
  if(res==='cleared')C.L.push({c:'good',t:'The site is clear.'});
  if(res==='escaped')m.combatResult='escaped';
  if(res==='withdrew'&&C.boss){C.L.push({c:'bad',t:'The objective force still holds. The platoon will have to try another way in.'});m.pendingSite.roll=7;}
  m.pendingSite.L=m.pendingSite.L.concat(C.L);

  save();
}
function wipe(L){

}
function fallBack(){var m=G.mission;m.fellBack=true;endMission(m.adv>0?'partial':'failure');save();}

/* ================= end of mission ================= */
function endMission(result){
  var m=G.mission,C=G.campaign,dep=deployed();
  var D={result:result,planet:m.planet,lines:[],scars:[],lost:[],edges:m.edges.slice(),renown:0,boon:result==='success',payment:null,warEvent:null,stageMsg:null,dm:0,kills:m.kills,wiped:!!m.wiped};
  C.missionNo++;
  if(result==='success')C.won++;else if(result==='partial')C.part++;else C.lost++;
  C.streak=result==='failure'?C.streak+1:0;
  if(result==='success'){D.renown=RENOWN[m.len][m.diff];C.renown+=D.renown;var pay=randomItem('artifact');D.payment=ARTIFACTS[pay.i].n;stow(pay,null);}
  else if(result==='partial'){D.renown=Math.floor(RENOWN[m.len][m.diff]/3);C.renown+=D.renown;}
  var dm=result==='success'?2:(result==='partial'?0:-2);if(m.wiped)dm=-3;D.dm=dm;C.momentum=clamp(C.momentum+dm,-10,10);
  dep.forEach(function(s){
    s.missions++;s.uav=0;
    if(m.wiped){s.scarsM=Math.max(1,s.scarsM);}
    var n=s.scarsM+s.psychM;
    if(n>0){
      var rolls=[];for(var i=0;i<n;i++){var r=rnd(6);if(r===6&&mods(s).unbreak)r=5;rolls.push(r);}
      var hi=Math.max.apply(null,rolls);
      if(m.wiped)hi=6;
      if(hi===6&&s.edge==='engram'&&!s.edgeUsed){s.edgeUsed=true;hi=5;D.scars.push(sqName(s)+'’s clone engram holds. They live. [Edge spent]');}
      if(hi===6){s.lost=true;var line=fill(pick(DEATH_LINES),{s:fullName(s),p:m.planet});D.lost.push(line);G.fallen.push({name:fullName(s),mission:C.missionNo,planet:m.planet});}
      else{
        var sit=hi-(hasUp('medbay')?1:0)-(s.edge==='mend'?1:0);s.out=Math.max(0,sit);var sc=pick(SCARS);s.scars.push(sc);
        D.scars.push(sqName(s)+' rolls '+rolls.join(', ')+' for '+n+' scar'+(n===1?'':'s')+': sits out '+s.out+' mission'+(s.out===1?'':'s')+'. Scar: '+sc+'.');
        if(!s.edge&&Math.random()<.5){grantEdge(s,null);D.edges.push(sqName(s)+' earns an Edge: '+EDGES[s.edge].n+'.');}
      }
    }
    s.brink=false;s.scarsM=0;s.psychM=0;
    if(!s.lost)s.troops=stat(s,'tr');
  });
  G.squads.forEach(function(s){s.dt=!s.lost&&dep.indexOf(s)<0&&s.out<=0;});
  G.squads.forEach(function(s){if(!s.lost&&dep.indexOf(s)<0&&s.out>0)s.out--;});
  G.squads=G.squads.filter(function(s){return !s.lost;});
  var ev=pick(WAR_EVENTS);D.warEvent=ev.t;
  ev.fx.forEach(function(f){var p=f.split(':');
    if(p[0]==='mom')C.momentum=clamp(C.momentum+ +p[1],-10,10);
    else if(p[0]==='threat')C.threatNext+=+p[1];
    else if(p[0]==='ren')C.renown=Math.max(0,C.renown+ +p[1]);
    else if(p[0]==='heal')G.squads.forEach(function(s){if(s.out>0)s.out--;});
    else if(p[0]==='cons'){addCons(randomCons(),1);addCons(randomCons(),1);}
  });
  C.since++;
  if(C.momentum>=10)advanceStage(D,'Decisive offensive: the enemy line breaks. Command immediately raises the stakes.');
  else if(C.since>=6)advanceStage(D,'Command declares a new phase of the war. The paperwork is the only difference.');
  else if(C.momentum<=-10){C.momentum=-4;C.threatNext+=3;D.stageMsg='The line collapses. Every site on the next mission is a little more crowded.';}
  if(C.streak>=2){C.renown+=3;D.relief='Command is embarrassed by the losses and releases 3 Renown of emergency funding.';}
  G.debrief=D;G.phase='debrief';G.mission=null;G.report=null;G.combat=null;
  pushLog('Mission '+C.missionNo+' ('+D.planet+'): '+result+'. Renown +'+D.renown+'.');
  D.lost.forEach(function(x){pushLog(x);});
}
function advanceStage(D,msg){
  var C=G.campaign;C.since=0;
  if(C.stage<4){C.stage++;D.stageMsg=msg+' Now entering: '+STAGES[C.stage].n+'.';}
  else{C.esc=Math.min(5,C.esc+1);D.stageMsg=msg+' The Attrition Phase deepens.';}
  C.momentum=0;pushLog('War update: '+D.stageMsg);
}
function takeBoon(k,sid){
  var D=G.debrief,s=findSq(sid);if(!D||!D.boon||!s)return;
  var t;
  if(k==='fr'){s.fr+=2;t='+2 Frequency';}
  else if(k==='po'){s.po=Math.min(4,s.po+2);t='+2 Potency steps';}
  else if(k==='tr'){s.tr+=2;s.troops=stat(s,'tr');t='+2 troops';}
  else if(k==='cs'){s.cs=Math.min(4,s.cs+2);t='+2 Combat steps';}
  else if(k==='arm'){s.arm=Math.min(6,s.arm+1);t='+1 armor';}
  else if(k==='orb'){var it=randomItem('orbital');if(!s.gear.orbital){s.gear.orbital=it;}else G.hold.push(it);t='the orbital '+ORBITALS[it.i].n;}
  else if(k==='spec'){var it2=randomItem('specialty');if(!s.gear.specialty){s.gear.specialty=it2;}else G.hold.push(it2);t='the specialty '+SPECS[it2.i].n;}
  D.boon=false;D.boonTaken=sqName(s)+' takes '+t+'.';pushLog('Boon: '+D.boonTaken);save();
}
function toShip(){G.phase='ship';G.debrief=null;genOffers();save();}

/* ================= ship ================= */
function genOffers(){
  var C=G.campaign,s=C.stage,base=baseTier();
  var slots=[base,'volunteer',rnd(10)<=[7,6,5,4,3][s]?'veteran':'volunteer'];
  G.offers=[];slots.forEach(function(k){G.offers.push({tier:k,s:newSquad(k),hired:false});});
  var pool=WEAPONS.map(function(w,i){return {k:'weapon',i:i};}).filter(function(x){return !WEAPONS[x.i].issue&&WEAPONS[x.i].r<=Math.min(5,s+3);})
    .concat(ARMORS.map(function(a,i){return {k:'armor',i:i};}).filter(function(x){return ARMORS[x.i].r<=Math.min(5,s+3);}));
  G.stock=shuffle(pool).slice(0,6).map(function(it){return {it:it,sold:false};});
}
function price(it){var d=itemDef(it);if(it.k==='weapon')return 2*d.r;if(it.k==='armor')return 4*d.r;return 8;}
function hire(i){
  var C=G.campaign,o=G.offers&&G.offers[i];if(!o||o.hired)return;var T=TIERS[o.tier];
  if(G.squads.length>=8||C.renown<T.cost)return;

function buyStock(i){

  C.renown-=p;o.sold=true;G.hold.push(o.it);pushLog('Bought the '+itemDef(o.it).n+' ('+p+' Renown).');

var DT_TYPES=[
 ['cw','Craft a weapon'],['ca','Craft armor'],['cc','Craft a consumable'],
 ['ro','Research an orbital'],['rs','Research a specialty'],
 ['tf','Train Frequency (+1)'],['tp','Train Potency (+1 step)'],['tt','Train Troops (+1)']
];
var TRAIN_COST=4,RESEARCH_RANKS=2;
function projRanks(k,i){if(k==='weapon')return WEAPONS[i].r;if(k==='armor')return ARMORS[i].r;return RESEARCH_RANKS;}
function rankCost(k){return {weapon:2,armor:4,orbital:8,specialty:8}[k];}
function sellValue(it){var d=itemDef(it);if(it.k==='weapon')return d.r;if(it.k==='armor')return 2*d.r;return 4;}
function dtTargets(type){
  if(type==='cw')return WEAPONS.map(function(w,i){return {v:i,n:w.n+' (rank '+w.r+')'};}).filter(function(x){return !WEAPONS[x.v].issue;}).sort(function(a,b){return WEAPONS[a.v].r-WEAPONS[b.v].r;});
  if(type==='ca')return ARMORS.map(function(a,i){return {v:i,n:a.n+' (rank '+a.r+')'};}).sort(function(a,b){return ARMORS[a.v].r-ARMORS[b.v].r;});
  if(type==='cc')return CONS.map(function(c,i){return {v:i,n:c.n};});
  if(type==='ro')return ORBITALS.map(function(o,i){return {v:i,n:o.n};});
  if(type==='rs')return SPECS.map(function(o,i){return {v:i,n:o.n};});
  return null;
}
function dtCost(type,target){
  if(type==='cw')return 2;if(type==='ca')return 4;if(type==='cc')return 1;if(type==='ro'||type==='rs')return 8;
  if(type==='tf'||type==='tp'||type==='tt')return TRAIN_COST;
  if(type==='pj'){var p=G.projects.filter(function(x){return x.id===+target;})[0];return p?rankCost(p.k):0;}
  return 0;
}
function doDowntime(sid,type,target){
  var C=G.campaign,s=findSq(sid);if(!s||!s.dt)return;
  var cost=dtCost(type,target);if(C.renown<cost)return;
  var msg=null;
  if(type==='tf'){s.fr+=1;msg=sqName(s)+' trains Frequency to '+s.fr+'.';}
  else if(type==='tp'){if(s.po>=4)return;s.po+=1;msg=sqName(s)+' trains Potency to '+dieLabel(s.po)+'.';}
  else if(type==='tt'){s.tr+=1;s.troops=stat(s,'tr');msg=sqName(s)+' trains up to '+s.tr+' base troops.';}
  else if(type==='cc'){var c=CONS[+target];if(!c)return;G.cons[c.n]=(G.cons[c.n]||0)+1;msg=sqName(s)+' crafts a '+c.n+'.';}
  else{
    var k,i,p;
    if(type==='pj'){p=G.projects.filter(function(x){return x.id===+target;})[0];if(!p)return;}
    else{
      k={cw:'weapon',ca:'armor',ro:'orbital',rs:'specialty'}[type];i=+target;if(isNaN(i)||!itemDef({k:k,i:i}))return;
      p=G.projects.filter(function(x){return x.k===k&&x.i===i;})[0];
      if(!p){p={id:G.nextId++,k:k,i:i,need:projRanks(k,i),done:0};G.projects.push(p);}
    }
    p.done++;
    var name=itemDef({k:p.k,i:p.i}).n;
    if(p.done>=p.need){G.projects=G.projects.filter(function(x){return x!==p;});G.hold.push({k:p.k,i:p.i});msg=sqName(s)+' finishes the '+name+'. It goes to the armory.';}
    else msg=sqName(s)+' puts a rank into the '+name+' ('+p.done+' of '+p.need+').';
  }
  C.renown-=cost;s.dt=false;
  msg+=cost?' ('+cost+' Renown)':'';
  G.dtLog.push(msg);pushLog('Downtime: '+msg);
}
function sellItem(idx){
  var it=G.hold[idx];if(!it)return;var v=sellValue(it);
  G.hold.splice(idx,1);G.campaign.renown+=v;pushLog('Sold the '+itemDef(it).n+' for '+v+' Renown.');
}

  }
  if(acts)h+='<h3>Gear and consumables</h3>'+acts;
  h+='<h3 style="margin-top:12px">Combat log</h3>'+logHTML(C.L.slice().reverse().slice(0,80))+'</section>';
  return h;
}
function viewDebrief(){
  var D=G.debrief,C=G.campaign;
  var stamp=D.result==='success'?['MISSION COMPLETE','ok']:(D.result==='partial'?['PARTIAL RESULT','mid']:['MISSION FAILED','']);
  var h='<section class="sheet"><h2>Debriefing: '+esc(D.planet)+'</h2><span class="stamp thunk '+stamp[1]+'">'+stamp[0]+'</span>';
  if(D.boon){
    h+='<h3>Choose a boon</h3><p class="muted">Success earns one boon for one squad.</p><div class="bar"><label class="muted" for="boonsq">Squad</label>'+sqSelect('boonsq',G.squads)+'</div><div class="bar">'
      +BOONS.map(function(b){return '<button class="btn small alt" data-act="boon" data-i="'+b[0]+'">'+esc(b[1])+'</button>';}).join('')+'</div>';
  }else h+='<div><button class="btn" data-act="next">Return to the ship</button></div>'+(D.boonTaken?'<p><b>Boon:</b> '+esc(D.boonTaken)+'</p>':'');
  h+='<dl class="form"><dt>Renown</dt><dd>+'+D.renown+' (now '+C.renown+')</dd>'+(D.payment?'<dt>Payment</dt><dd>'+esc(D.payment)+'</dd>':'')+'<dt>Kills</dt><dd>'+D.kills+'</dd><dt>Momentum</dt><dd>'+(D.dm>=0?'+':'')+D.dm+' (now '+(C.momentum>0?'+':'')+C.momentum+')</dd></dl>';
  if(D.wiped)h+='<p>The whole platoon went down. Every squad rolls its scars, and the Corps sends more.</p>';
  if(D.lost.length)h+='<h3>Lost</h3>'+ul(D.lost);
  if(D.scars.length)h+='<h3>Scars</h3>'+ul(D.scars);
  if(D.edges.length)h+='<h3>Edges</h3>'+ul(D.edges);
  if(D.relief)h+='<h3>Command response</h3><p>'+esc(D.relief)+'</p>';
  h+='<h3>War report</h3><p>'+esc(D.warEvent)+'</p>'+(D.stageMsg?'<p><b>'+esc(D.stageMsg)+'</b></p>':'');
  return h+'</section>';
}
function viewMission(){
  if(G.phase==='ship')return viewShip();
  if(G.phase==='planning')return viewPlanning();
  if(G.phase==='briefing')return viewBriefing();
  if(G.phase==='combat')return viewCombat();
  if(G.phase==='route')return viewRoute();
  if(G.phase==='debrief')return viewDebrief();
  return '';
}
function canRefit(){return G.phase==='ship'||G.phase==='planning'||G.phase==='briefing'||G.phase==='debrief';}
var OPEN=null;
function gearDesc(k,d){
  if(!d)return '';
  if(k==='weapon')return 'Combat die +'+d.r+' step'+(d.r===1?'':'s')+'.';
  if(k==='armor')return 'Rank '+d.r+': '+armorText(d)+'.';
  return d.d||'';
}
function gearCell(s,k){
  var d=itemDef(s.gear[k]),label=esc(d?d.n:'\u2014')+(d&&k==='weapon'?' <span class="muted">(+'+d.r+')</span>':'');
  var desc=d?esc(gearDesc(k,d)):'';
  var opts=[];
  if(canRefit()){
    G.hold.forEach(function(it,i){if(it.k===k){var x=itemDef(it);opts.push('<option value="'+i+'">'+esc(x.n+(k==='weapon'?' (+'+x.r+')':(k==='armor'?' (rank '+x.r+')':'')))+'</option>');}});
    if(d&&!(k==='weapon'&&WEAPONS[s.gear.weapon.i].issue))opts.push('<option value="off">'+(k==='weapon'?'Return to armory (Corps issue)':'Return to armory')+'</option>');
  }
  var key=s.id+':'+k;
  var sel=opts.length?'<select class="gearpick" data-swap="'+key+'" data-desc="'+desc+'" aria-label="Change '+k+' for '+esc(s.call)+'"><option value="" selected>'+esc(d?d.n:'Empty')+'</option>'+opts.join('')+'</select>':'';
  return '<span class="gearwrap'+(opts.length?' pickable':'')+'" data-desc="'+desc+'"'+(desc?' title="'+desc+'"':'')+'>'+label+sel+'</span>';
}
function canReorder(){return G.phase==='ship'||G.phase==='planning'||G.phase==='debrief';}
function moveSquadTo(sid,tid){
  var a=G.squads,i=a.findIndex(function(s){return s.id===sid;}),j=a.findIndex(function(s){return s.id===tid;});
  if(i<0||j<0||i===j)return;var s=a.splice(i,1)[0];a.splice(j,0,s);
  pushLog(s.call+' moves to position '+(j+1)+' in the platoon order.');
}
function viewPlatoon(){
  var S=G.squads,ship=G.phase==='ship';
  var rows=[
    ['Role',function(s){return s.out>0?'Sitting out '+s.out:(deployed().indexOf(s)>=0?(isLt(s)?'Lieutenant':'Deployed'):'Reserve'+(s.dt?' (downtime ready)':''));}],
    ['Name',function(s){return esc(s.first+' '+s.last);}],
    ['Troops',function(s){return troopBar(s);}],
    ['Combat die',function(s){return dieLabel(stat(s,'cs'))+' <span class="muted">(base '+dieLabel(s.cs)+')</span>';}],
    ['Armor',function(s){return stat(s,'arm');}],
    ['Potency',function(s){return dieLabel(stat(s,'po'));}],
    ['Frequency',function(s){return stat(s,'fr');}],
    ['Weapon',function(s){return gearCell(s,'weapon');}],
    ['Armor item',function(s){return gearCell(s,'armor');}],
    ['Artifact',function(s){return gearCell(s,'artifact');}],
    ['Orbital',function(s){return gearCell(s,'orbital');}],
    ['Specialty',function(s){return gearCell(s,'specialty');}],
    ['Edge',function(s){return s.edge?'<span class="edge">'+esc(EDGES[s.edge].n)+'</span>'+(s.edge==='engram'&&s.edgeUsed?' (spent)':'')+'<br><span class="muted">'+esc(EDGES[s.edge].d)+'</span>':'None';}],
    ['Recruited as',function(s){return esc(s.tier);}],
    ['Missions',function(s){return s.missions;}],
    ['Scars',function(s){return s.scars.length?esc(s.scars.join('; ')):'None';}]
  ];
  var h='<section class="sheet"><h2>Platoon</h2><p class="muted">The first four ready squads deploy. The first of them is the Lieutenant’s squad.'+(canReorder()?' Drag a squad\u2019s portrait left or right to change the order.':' The order can be changed between missions.')+'</p><div class="tablewrap"><table class="squad"><thead><tr><th scope="col"><span class="muted">Squad</span></th>';
  var dr=canReorder();
  S.forEach(function(s){h+='<th scope="col"'+(dr?' class="dragcol" data-sid="'+s.id+'"':'')+'>'+pfImg(s)+esc(s.call)+(dr?'<span class="draghint" aria-hidden="true">\u2194 drag</span>':'')+'</th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr><th scope="row">'+r[0]+'</th>';S.forEach(function(s,i){h+='<td>'+r[1](s,i)+'</td>';});h+='</tr>';});
  h+='</tbody></table></div></section>';
  h+='<section class="sheet"><h3>Memorial wall</h3>'+(G.fallen.length?ul(G.fallen.slice().reverse().map(function(f){return f.name+', lost on mission '+f.mission+' at '+f.planet+'.';})):'<p class="muted">Nobody yet. The wall has been ordered in bulk.</p>')+'</section>';
  return h;
}
function quartermaster(){
  var C=G.campaign,h='';
  if(!G.stock){return '<section class="sheet"><h2>Quartermaster</h2><p class="muted">The quartermaster opens aboard ship between missions.</p></section>';}
  h+='<section class="sheet"><h2>Quartermaster</h2><p class="muted">Weapons cost 2 Renown per rank and raise the squad’s combat die one step per rank. Armor costs 4 per rank. Purchases go to the armory.</p><div class="shop">';
  (G.stock||[]).forEach(function(o,i){
    var d=itemDef(o.it),p=price(o.it);
    h+='<article class="card"><h3>'+esc(d.n)+'</h3><small>'+(o.it.k==='weapon'?'Weapon, rank '+d.r+': combat die +'+d.r+' step'+(d.r===1?'':'s'):'Armor, rank '+d.r+': '+esc(armorText(d)))+'</small><div style="margin-top:8px">'
      +(o.sold?'<p class="owned">In the armory</p>':'<button class="btn small" data-act="buystock" data-i="'+i+'"'+(C.renown<p?' disabled':'')+'>Buy: '+p+' Renown</button>')+'</div></article>';
  });
  h+='</div></section>';
  return h;
}
function viewArmory(){
  var ship=G.phase==='ship'||G.phase==='planning'||G.phase==='debrief';
  var h='<section class="sheet"><h2>Armory</h2><p class="muted">Loot goes to the Lieutenant first, then down the line. Anything nobody can use waits here. Between missions, gear sells for half its price; consumables can\u2019t be sold.'+(ship?'':' Gear can be reissued between missions.')+'</p>';
  if(!G.hold.length)h+='<p class="muted">Empty.</p>';
  else{
    var KN={weapon:'Weapon',armor:'Armor',artifact:'Artifact',orbital:'Orbital',specialty:'Specialty'},ORD=['weapon','armor','artifact','orbital','specialty'];
    var idx=G.hold.map(function(it,i){return i;}).sort(function(a,b){var x=G.hold[a],y=G.hold[b];return ORD.indexOf(x.k)-ORD.indexOf(y.k)||itemRank(y)-itemRank(x)||itemDef(x).n.localeCompare(itemDef(y).n);});
    h+='<ul class="armlist">';
    idx.forEach(function(i){var it=G.hold[i],d=itemDef(it),desc=esc(gearDesc(it.k,d));
      h+='<li><span class="armname" data-desc="'+desc+'" title="'+desc+'">'+esc(d.n)+' <span class="muted">'+KN[it.k]+(d.r?' \u00b7 rank '+d.r:'')+'</span></span>'
        +(ship?'<span class="armact">'+sqSelect('eq-'+i,G.squads).replace('class="sel"','class="sel mini" aria-label="Issue to"')+'<button class="mini" data-act="equip" data-i="'+i+'">Issue</button><button class="mini alt" data-act="sell" data-i="'+i+'">Sell '+sellValue(it)+'</button></span>':'')+'</li>';});
    h+='</ul><p class="muted" style="font-size:14px;margin-top:6px">Hover or press and hold an item to see what it does. Sell prices are in Renown.</p>';
  }
  h+='</section><section class="sheet"><h3>Consumables</h3>'+(Object.keys(G.cons).length?ul(Object.keys(G.cons).map(function(k){var d=CONS.filter(function(c){return c.n===k;})[0];return k+' ×'+G.cons[k]+': '+d.d;})):'<p class="muted">None.</p>')+'</section>';
  return h+quartermaster();
}
function viewWar(){
  var C=G.campaign,S=STAGES[C.stage],own=UPGRADES.filter(function(u){return C.ship.up[u.id];});
  return '<section class="sheet"><h2>'+esc(S.n)+'</h2><p class="muted">'+esc(S.b)+'</p>'+momBar().replace('class="mom"','class="mom" style="justify-content:flex-start;margin:10px 0"')
   +'<dl class="form"><dt>Momentum</dt><dd>'+(C.momentum>0?'+':'')+C.momentum+' of 10. At +10 the war escalates. At −10 the line collapses.</dd>'
   +'<dt>Missions</dt><dd>'+C.missionNo+' filed: '+C.won+' complete, '+C.part+' partial, '+C.lost+' failed</dd>'
   +'<dt>Next phase</dt><dd>'+(C.stage<4?'In '+Math.max(1,6-C.since)+' missions, or on a decisive offensive':'None. Escalation '+C.esc+' of 5.')+'</dd>'
   +'<dt>Star destroyer</dt><dd>'+esc(C.ship.name)+(own.length?': '+esc(own.map(function(u){return u.n;}).join(', ')):', no upgrades yet')+'</dd></dl>'
   +'<p class="muted">Faction plans and progress clocks arrive in Phase 3.</p></section>';
}
function viewArchive(){
  var h='<section class="sheet"><h2>Campaign archive</h2><div class="log">';
  if(!G.log.length)h+='<p class="muted">Empty.</p>';
  G.log.slice().reverse().forEach(function(x){h+='<p>Mission '+x.m+': '+esc(x.t)+'</p>';});
  h+='</div><hr class="rule thin">';
  h+=G.confirmReset?'<p><b>Erase this campaign and start over?</b></p><button class="btn small" data-act="reset2">Yes, erase it</button><button class="btn small alt" data-act="reset0">Cancel</button>':'<button class="btn small alt" data-act="reset1">Start a new campaign</button>';
  return h+'</section>';
}
function normalize(g){
  if(!g)return g;
  g.projects=g.projects||[];g.dtLog=g.dtLog||[];g.hold=g.hold||[];g.cons=g.cons||{};g.fallen=g.fallen||[];g.squads=g.squads||[];
  g.squads.forEach(function(s){if(s.dt===undefined)s.dt=false;if(!s.scars)s.scars=[];});
  return g;
}
function render(){
  var v=$('#view');if(!v)return;
  normalize(G);
  renderMast();renderTabs();
  var h='';
  if(!G||G.phase==='title')h=viewTitle();
  else if(G.tab==='platoon')h=viewPlatoon();
  else if(G.tab==='armory')h=viewArmory();
  else if(G.tab==='war')h=viewWar();
  else if(G.tab==='archive')h=viewArchive();
  else h=viewMission();
  v.innerHTML=h;
}

/* ================= events ================= */
function selVal(id){var e=document.getElementById(id);return e?+e.value:NaN;}
function act(a,i){
  if(a==='new')newCampaign();
  else if(a==='resume'){var s=loadSaved();if(s){G=normalize(s);G.tab='mission';G.confirmReset=false;}}
  else if(a==='tab'){G.tab=i;G.confirmReset=false;}
  else if(a==='pick')startMission(+i);
  else if(a==='deploy')deploy();
  else if(a==='route'){G.report=null;takeRoute(+i);}
  else if(a==='cont'){var m=G.mission;G.report=null;if(m.pendingEnd)endMission(m.pendingEnd);else if(m.done)endMission('success');}
  else if(a==='fallback')fallBack();
  else if(a==='round')fightRound();
  else if(a==='untilpause')runUntilPause();
  else if(a==='auto')runAuto();
  else if(a==='orb')callOrbital(i,false);
  else if(a==='orbforce')callOrbital(i,true);
  else if(a==='use'){var p=String(i).split(':');useItem(p[0],p[1]);}
  else if(a==='cons')useCons(i,selVal('consq'));
  else if(a==='boon')takeBoon(i,selVal('boonsq'));
  else if(a==='next')toShip();
  else if(a==='hire')hire(+i);
  else if(a==='buystock')buyStock(+i);
  else if(a==='buyup')buyUp(i);
  else if(a==='toplan')toPlanning();
  else if(a==='equip')equip(+i,selVal('eq-'+i));
  else if(a==='up')moveUp(i);
  else if(a==='downtime'){var dsel=DTSEL[+i];if(dsel){doDowntime(+i,dsel.type,dsel.target);delete DTSEL[+i];}}
  else if(a==='sell')sellItem(+i);
  else if(a==='gearopen'){OPEN=OPEN===i?null:i;}
  else if(a==='swapto'){var q3=String(i).split(':');equip(+q3[1],+q3[0]);OPEN=null;}
  else if(a==='swap'){var q=String(i).split(':');var hi=selVal('g-'+q[0]+'-'+q[1]);if(!isNaN(hi))equip(hi,+q[0]);}
  else if(a==='unequip'){var q2=String(i).split(':');unequip(+q2[0],q2[1]);OPEN=null;}
  else if(a==='reset1')G.confirmReset=true;
  else if(a==='reset0')G.confirmReset=false;
  else if(a==='reset2'){try{localStorage.removeItem(KEY);}catch(e){}G=freshG();}
  if(G&&G.phase!=='title')save();
  render();
  var still={downtime:1,sell:1,gearopen:1,swapto:1,swap:1,unequip:1,tab:1,reset0:1,reset1:1,hire:1,buystock:1,buyup:1,equip:1,up:1,orb:1,orbforce:1,use:1,cons:1,round:1};
  if(!still[a]&&window.scrollTo)window.scrollTo(0,0);
}
var DRAG=null;
function colAt(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.dragcol'):null;}
document.addEventListener('pointerdown',function(e){
  var th=e.target.closest?e.target.closest('.dragcol'):null;if(!th||!canReorder())return;
  DRAG={sid:+th.getAttribute('data-sid'),x:e.clientX,y:e.clientY,on:false,el:th,tgt:null};
  try{th.setPointerCapture(e.pointerId);}catch(err){}
});
document.addEventListener('pointermove',function(e){
  if(!DRAG)return;
  if(!DRAG.on&&Math.abs(e.clientX-DRAG.x)+Math.abs(e.clientY-DRAG.y)>8){DRAG.on=true;DRAG.el.classList.add('dragging');}
  if(!DRAG.on)return;
  e.preventDefault();
  var t=colAt(e.clientX,e.clientY);
  if(DRAG.tgt&&DRAG.tgt!==t)DRAG.tgt.classList.remove('droptarget');
  if(t&&t!==DRAG.el){t.classList.add('droptarget');DRAG.tgt=t;}else DRAG.tgt=null;
  var wrap=DRAG.el.closest('.tablewrap');if(wrap){var r=wrap.getBoundingClientRect();if(e.clientX>r.right-30)wrap.scrollLeft+=12;else if(e.clientX<r.left+30)wrap.scrollLeft-=12;}
});
function endDrag(){
  if(!DRAG)return;var d=DRAG;DRAG=null;
  d.el.classList.remove('dragging');if(d.tgt)d.tgt.classList.remove('droptarget');
  if(d.on&&d.tgt){moveSquadTo(d.sid,+d.tgt.getAttribute('data-sid'));save();render();}
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
var tipT=null,lpT=null,lpFired=false;
function showTip(text,x,y){
  if(!text)return;var t=document.getElementById('tip');if(!t){t=document.createElement('div');t.id='tip';document.body.appendChild(t);}
  t.textContent=text;t.style.left=Math.max(8,Math.min(window.innerWidth-248,x-120))+'px';t.style.top=(y+14)+'px';t.style.display='block';
  clearTimeout(tipT);tipT=setTimeout(function(){t.style.display='none';},3000);
}
document.addEventListener('touchstart',function(e){
  var w=e.target.closest?e.target.closest('[data-desc]'):null;lpFired=false;if(!w)return;
  var p=e.touches[0];clearTimeout(lpT);
  lpT=setTimeout(function(){lpFired=true;showTip(w.getAttribute('data-desc'),p.clientX,p.clientY);},500);
},{passive:true});
document.addEventListener('touchmove',function(){clearTimeout(lpT);},{passive:true});
document.addEventListener('touchend',function(e){clearTimeout(lpT);if(lpFired){e.preventDefault();lpFired=false;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}},{passive:false});
document.addEventListener('change',function(e){
  var t0=e.target;
  if(t0&&t0.getAttribute&&t0.getAttribute('data-dt')){var sd=+t0.getAttribute('data-dt'),v=t0.value;if(v.indexOf('pj:')===0)DTSEL[sd]={type:'pj',target:v.slice(3)};else DTSEL[sd]={type:v,target:''};render();return;}
  if(t0&&t0.getAttribute&&t0.getAttribute('data-dtt')){var sd2=+t0.getAttribute('data-dtt');DTSEL[sd2]=DTSEL[sd2]||{};DTSEL[sd2].target=t0.value;render();return;}
  var t=e.target;if(!t||!t.getAttribute||!t.getAttribute('data-swap')||t.value==='')return;
  var q=t.getAttribute('data-swap').split(':');
  if(t.value==='off')unequip(+q[0],q[1]);else equip(+t.value,+q[0]);
  OPEN=null;save();render();
});
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-act]'):null;
  if(!b||b.disabled)return;
  act(b.getAttribute('data-act'),b.getAttribute('data-i'));
});
G=freshG();
render();
window.DT={act:act,get:function(){return G;},dt:doDowntime};

})();
</script>
</body>
