*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body);font-variant-numeric:lining-nums}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% -10%,var(--glow),transparent 60%),var(--stars)}
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:18px 56px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
.eyebrow{font:600 13px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
header.house .eyebrow::before{content:"◆";color:var(--gold);margin:0 .6em;font-size:.8em}
header.house .eyebrow::before{margin-left:0}
.muted{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 14px;min-height:44px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.main{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
button.danger{border-color:var(--blood);color:var(--blood)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}

/* house header */
header.house{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 22px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sigil{width:88px;height:104px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.hname{display:block;width:100%;margin:4px 0 0 -4px;padding:0 4px;background:transparent;border:1px solid transparent;border-radius:3px;font:700 clamp(28px,5.5vw,52px)/1.08 var(--f-display);letter-spacing:.04em;text-transform:uppercase;resize:none;overflow:hidden;white-space:normal;overflow-wrap:break-word;color:inherit;line-height:1.08}
.hwords,.hseat{display:block;width:100%;margin-left:-4px;padding:0 4px;background:transparent;border:1px solid transparent;border-radius:3px}
.hwords{font-style:italic;font-size:19px}
.hseat{font-size:15px;color:var(--muted)}
.hsub{margin:2px 0 0;font-size:15px;color:var(--muted)}
.readout b,.stats .sv,.tally b{font-family:var(--f-mono);font-weight:600}
.seasonbar{display:grid;gap:10px}
@media (max-width:520px){ol.seasons{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kdot{display:inline-block;width:9px;height:9px;transform:rotate(45deg);margin-right:6px;vertical-align:1px}
.kbadge{flex:none;width:14px;height:14px;transform:rotate(45deg)}
details.how summary{cursor:pointer}details.how ul{padding-left:18px;font-size:15px}details.how li{margin:4px 0}
.suitors{display:grid;gap:6px;margin:8px 0}
.suitors button{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:4px 10px;align-items:start;text-align:left;padding:6px 8px;background:var(--panel);min-height:auto}
.suitors button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.suitors .pf{width:48px;height:48px}
.suitors .sname{display:block;font:600 16px/1.2 var(--f-display);letter-spacing:.02em}
.suitors .tier{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-left:8px}
.suitors .sline{display:block;font-size:14px;line-height:1.3;color:var(--muted)}
.suitors .sline.perk{color:var(--ink)}
.suitors b.price{font:600 14px var(--f-display);color:var(--gold);white-space:nowrap}
ul.kinlist li .sm{margin-left:6px}
ul.log{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.t-Salvage{--tc:var(--kin)}.t-Trade{--tc:var(--gold)}.t-Bounty{--tc:var(--blood)}.t-Dogfight{--tc:var(--accent)}
.hname:hover,.hwords:hover,.hseat:hover{border-color:var(--line)}
.hname:focus,.hwords:focus,.hseat:focus{background:var(--field);border-color:var(--accent);outline:none}
.readout{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.readout div{display:flex;flex-direction:column;gap:2px;min-width:4.5em}
.readout b{font:600 24px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}
.bar .note{font-size:14px;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--blood);border-radius:3px;padding:8px 12px;margin:6px 0}

/* section nav */
nav.sect{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0;border-bottom:1px solid var(--line)}
nav.sect button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;font:600 17px var(--f-display);letter-spacing:.04em;color:var(--muted);padding:6px 12px}
nav.sect button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.sect .soon{font:500 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;margin-left:6px;color:var(--muted);vertical-align:2px}

/* panels */
.pane{position:relative;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:3px;padding:14px;min-width:0}
.pane::before,.pane::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--gold);pointer-events:none}
.pane::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.pane::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.pane h2{font-size:22px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}

/* roster */
ul.roster{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ul.roster .ghead{margin:12px 0 2px;padding:0 4px 4px;border-bottom:1px solid var(--line);font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
ul.roster .ghead:first-child{margin-top:0}
ul.roster li.grp>details>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;min-height:32px}
ul.roster li.grp>details>summary::-webkit-details-marker{display:none}
ul.roster li.grp>details>summary::before{content:"▸";transition:transform .15s}
ul.roster li.grp>details[open]>summary::before{transform:rotate(90deg)}
ul.roster li.grp:first-child .ghead{margin-top:0}
details.lgrp{margin:0 0 8px}
details.lgrp>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;min-height:32px;font:600 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
details.lgrp>summary::-webkit-details-marker{display:none}
details.lgrp>summary::before{content:"▸";color:var(--gold);transition:transform .15s}
details.lgrp[open]>summary::before{transform:rotate(90deg)}
details.lgrp .gn{margin-left:auto;font:500 13px var(--f-body);color:var(--muted);letter-spacing:.04em;text-transform:none}
details.lgrp>ul.hl{margin-top:6px}
ul.roster .gn{margin-left:auto;font:500 12px var(--f-body);color:var(--muted);letter-spacing:.06em}
ul.roster li.grp>details>ul.roster{margin-top:4px}
ul.roster button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:none;border:1px solid transparent;padding:6px 8px}
ul.roster button:hover{background:var(--field)}
ul.roster button[aria-current="true"]{background:var(--field);border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.rn{display:block;font:600 17px/1.1 var(--f-display);letter-spacing:.03em}
.rj{display:block;font-size:14px;color:var(--muted)}
.rj .hot{color:var(--blood)}
.pf{display:block;flex:none;image-rendering:pixelated;border-radius:2px;box-shadow:0 0 0 1px var(--line)}

/* dossier */
.dhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
figure.cam{margin:0;width:158px;padding:6px;background:var(--field);border:1px solid var(--line);border-radius:3px}
figure.cam .pf{width:144px;height:144px}
.figs{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;max-width:330px}.figs>button{flex-basis:100%}
figure.cam figcaption{font:500 12px/1.3 var(--f-body);color:var(--muted);text-align:center;padding-top:6px;letter-spacing:.06em;text-transform:uppercase}
.given{font:700 30px/1.1 var(--f-display);letter-spacing:.04em;background:transparent;border:1px solid transparent;border-radius:3px;padding:0 4px;margin-left:-4px;width:100%;text-transform:uppercase}
.mtitle{font-size:17px;background:transparent;border:1px solid transparent;border-radius:3px;padding:0 4px;margin-left:-4px;width:100%;color:var(--muted)}
.given:hover,.mtitle:hover{border-color:var(--line)}
.given:focus,.mtitle:focus{background:var(--field);border-color:var(--accent);outline:none}
.origin{margin:6px 0 2px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.status{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid currentColor}
.status.ok{color:var(--accent)}.status.bad{color:var(--blood)}.status.young{color:var(--gold)}.status.kin{color:var(--kin)}
.d h3{font-size:16px;letter-spacing:.08em;text-transform:uppercase;margin:20px 0 8px;color:var(--muted)}
.stats{display:grid;grid-template-columns:6.5em minmax(0,1fr) 2.2em;gap:4px 12px;align-items:center}
.stats .sn{font:600 16px var(--f-display);letter-spacing:.03em}
.stats .sv{font:600 20px var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.pips i{height:12px;border:1px solid var(--line);border-radius:1px}
.pips i.on{background:var(--accent);border-color:var(--accent)}
.stats .help{grid-column:1/-1;margin:0 0 4px;font-size:15px;color:var(--muted)}
.stats .skills{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.skills button{min-height:36px;padding:2px 12px;font-size:15px}
.skills button b{font-family:var(--f-display);font-variant-numeric:tabular-nums;margin-left:6px;color:var(--gold)}
.train{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:-4px 0 14px;font-size:15px}
.train button{min-height:36px;padding:2px 12px;font-size:15px}
.train .q{color:var(--gold);font-weight:600}
.train .paused{color:var(--blood)}
.hedit{display:block;width:100%;margin-left:-4px;padding:0 4px;background:transparent;border:1px solid transparent;border-radius:3px}
.hedit.nm{font:600 18px var(--f-display);letter-spacing:.01em}
.hedit.st{font-size:15px;color:var(--muted)}
.hedit:hover{border-color:var(--line)}.hedit:focus{background:var(--panel);border-color:var(--accent);outline:none}
.hmsg{margin:2px 0 0;font-size:14px;color:var(--blood)}
.royaledit{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.royaledit .fld{flex:1;min-width:10em}
.royaledit input{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 10px;min-height:44px;width:100%}
.sgback{position:fixed;inset:0;z-index:50;background:rgba(8,12,26,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.sgpanel{position:relative;width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.sgpanel::before,.sgpanel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--gold);pointer-events:none}
.sgpanel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.sgpanel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.sghead{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.sghead svg{width:96px;height:113px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.sghead h2{font-size:22px}
.sgpanel h3{font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.sgrule{margin:4px 0 0;font-size:14px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 10px 4px 6px;font-size:14px;background:var(--field)}
.swatches i{width:22px;height:22px;border-radius:2px;border:1px solid rgba(0,0,0,.45);flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;min-height:auto;font-size:13px;background:var(--field)}
.tiles svg{width:40px;height:47px}
.swatches button[aria-pressed="true"],.tiles button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow);font-weight:600}
.sgfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.rolled{font-size:16px;min-height:1.6em;margin:2px 0 0;padding:8px 12px;background:var(--field);border-left:3px solid var(--line)}
.rolled.hit{border-left-color:var(--accent)}.rolled.miss{border-left-color:var(--blood)}
.rolled .hit{color:var(--accent);font-weight:600}.rolled .miss{color:var(--blood);font-weight:600}
.health{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.hp{display:flex;flex-wrap:wrap;gap:4px}
.hp i{width:18px;height:18px;border:1px solid var(--blood);border-radius:50%}
.hp i.on{background:var(--blood)}
.hp i.armor{border-style:dashed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.slot{display:flex;flex-direction:column;gap:3px;background:var(--field);border:1px solid var(--line);border-radius:3px;padding:8px 10px;min-width:0}
.slot label{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.slot select{background:transparent;border:0;border-bottom:1px dashed var(--line);padding:2px 0;min-height:34px;width:100%}
.slot textarea{background:transparent;border:0;border-bottom:1px dashed var(--line);padding:2px 0;resize:none;line-height:1.35;min-height:2.8em;field-sizing:content}
.slot textarea:focus,.slot select:focus{outline:none;border-bottom-color:var(--accent)}
.slot small{color:var(--muted);font-size:13px}
ul.quirks{margin:0;padding-left:20px}
ul.kinlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.kinlist button{background:none;border:0;padding:0;min-height:auto;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.tk{display:inline-block;font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border:1px solid currentColor;border-radius:2px;margin-right:6px;color:var(--kin);min-width:5.5em;text-align:center}

/* roster nodes */
.treewrap{overflow-x:auto;padding-bottom:6px}
svg.tree{display:block;margin:0 auto}
svg.tree .node{cursor:pointer}
svg.tree .node rect.card{fill:var(--field);stroke:var(--line);stroke-width:1.5}
svg.tree .node.sel rect.card{stroke:var(--accent);stroke-width:3}
svg.tree .node.dead rect.card{stroke-dasharray:4 3}
svg.tree .node:focus-visible rect.card{stroke:var(--accent);stroke-width:3}
svg.tree .node:focus{outline:none}
svg.tree text.nm{fill:var(--ink);font:600 13px var(--f-display);letter-spacing:.03em}
svg.tree text.tt{fill:var(--muted);font:13px var(--f-body)}
svg.tree text.og{fill:var(--gold);font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase}
svg.tree path.blood{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:2}
svg.tree path.adopt{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:6 4}
svg.tree line.wed{stroke:var(--kin);stroke-width:4}
.legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;font-size:14px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:24px;border-top:3px solid;vertical-align:middle;margin-right:6px}
.legend .b{border-color:var(--ink);opacity:.6}.legend .a{border-color:var(--gold);border-top-style:dashed}.legend .w{border-color:var(--kin)}

.later{max-width:660px}
.later p{margin:6px 0}
.later ul{margin:8px 0 0;padding-left:20px}
.later li{margin:4px 0}


/* operations */
.cyclebar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
#main{display:grid;gap:16px}
.boardhead{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between;margin-bottom:10px}.boardhead h2{margin:0}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.opcard{display:flex;flex-direction:column;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:3px;padding:12px;min-width:0}
.opcard.planning{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.t-Salvage{--tc:var(--kin)}.t-Trade{--tc:var(--gold)}.t-Bounty{--tc:var(--blood)}.t-Dogfight{--tc:var(--accent)}
.optype{display:flex;align-items:center;gap:8px;font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--tc)}
.optype::before{content:"";flex:none;width:9px;height:9px;transform:rotate(45deg);background:var(--tc)}
.opcard h3{font-size:18px;letter-spacing:.01em}
.opdl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;margin:0;font-size:15px}
.opdl dt{font:600 11px/2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.opdl dd{margin:0}
.dpip{color:var(--tc);letter-spacing:.1em}
.mini{width:20px;height:24px;vertical-align:-6px;margin-right:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.teampick{display:grid;gap:4px}
.teampick button{display:flex;gap:8px;align-items:center;text-align:left;padding:4px 8px;min-height:44px;background:var(--panel)}
.teampick button span{min-width:0;flex:1}
.teampick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.teampick b{font:600 14px var(--f-display);white-space:nowrap;color:var(--gold)}
.teampick .pf{width:48px;height:48px}
.teampick.scroll{grid-template-columns:minmax(0,1fr);max-height:368px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px;scrollbar-gutter:stable}
.teampick.scroll button{height:58px;min-width:0;width:100%}
.teampick.scroll button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.morehint{margin:0;font-size:14px;color:var(--gold)}
.track{display:flex;gap:4px}
.track i{flex:1;height:8px;border:1px solid var(--line)}
.track i.ok{background:var(--accent);border-color:var(--accent)}.track i.miss{background:var(--blood);border-color:var(--blood)}.track i.now{border:2px solid var(--ink)}
.reslist,.gains{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.gains{padding-left:18px;list-style:disc}
.reslist .ok{color:var(--accent);font-weight:600}.reslist .miss{color:var(--blood);font-weight:600}
.outcome{margin:0;font:600 19px var(--f-display)}.outcome.full{color:var(--accent)}.outcome.partial{color:var(--gold)}.outcome.fail{color:var(--blood)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.hold h3,.two h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin:16px 0 6px;color:var(--muted)}
.hold p{margin:0}
.tally{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--muted)}
.tally div{display:flex;flex-direction:column;gap:2px}
.tally b{font:600 22px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
ul.hl{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:16px}
.hot{color:var(--blood)}
button.sm{min-height:36px;padding:2px 10px;font-size:15px;margin-top:4px}
ul.rivals{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.rivals li{display:flex;gap:12px;align-items:center}
.rsig{width:34px;height:40px;flex:none}
.host{display:flex;gap:3px;flex:none}
.host i{width:10px;height:10px;border:1px solid var(--blood);transform:rotate(45deg)}
.host i.on{background:var(--blood)}
ul.chron{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:16px}
.cy{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-right:6px}

/* seasons + realm */
ol.seasons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;list-style:none;margin:12px 0 0;padding:0}
ol.seasons li{padding:6px 8px;border:1px solid var(--line);border-radius:3px;font-size:14px;color:var(--muted);text-align:center}
ol.seasons li b{display:block;font:600 14px var(--f-display);letter-spacing:.06em;color:var(--ink)}
ol.seasons li.now{border-color:var(--accent);background:var(--field);box-shadow:0 0 0 3px var(--glow);color:var(--ink)}
ul.news{margin:0;padding:0 0 0 18px;display:grid;gap:6px;font-size:17px}
ul.news li.bad::marker{color:var(--blood)}ul.news li.good::marker{color:var(--accent)}ul.news li.warn::marker{color:var(--gold)}
ul.news li.bad{color:var(--blood)}
.crownrow{display:flex;gap:16px;align-items:center}
.rsig.big{width:64px;height:76px}
.kname{margin:0;font:700 24px/1.15 var(--f-display);letter-spacing:.03em}
.favor{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fbar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;flex:1;min-width:140px}
.fbar i{height:12px;border:1px solid var(--gold)}.fbar i.on{background:var(--gold)}
.favor b{font:600 22px var(--f-display);font-variant-numeric:tabular-nums}
ul.offices,ul.claim{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.offices li,ul.claim li{display:flex;gap:10px;align-items:center;font-size:16px}
.crisis{border-color:var(--blood)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.hcard{display:flex;flex-direction:column;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:3px;padding:12px;min-width:0}
.hhead{display:flex;gap:10px;align-items:center}
.hcard h3{font-size:18px;min-width:0;overflow-wrap:anywhere}
.okc{color:var(--accent)}
.secrets{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:8px}
.sec{display:grid;gap:4px;font-size:15px;font-style:italic}
.sec .acts{font-style:normal}

/* command and crew ties */
.srow{display:flex;gap:12px;align-items:center}
.srow .pf{width:48px;height:48px}
ol.line{margin:0;padding-left:22px;display:grid;gap:4px}
button.linkish{background:none;border:0;padding:0;min-height:auto;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld span{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld select{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 10px;min-height:44px;width:100%}

/* market + relations */
ul.wares{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ware{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:16px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.ware:last-child{border-bottom:0;padding-bottom:0}
.give{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.give select{background:var(--panel);border:1px solid var(--line);border-radius:3px;min-height:36px;padding:2px 8px;max-width:14em}
.tablewrap{overflow-x:auto}
table.rel{width:100%;border-collapse:collapse;font-size:15px;min-width:620px}
table.rel th,table.rel td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.rel thead th{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
table.rel tbody th{font:600 15px var(--f-display);letter-spacing:.03em;overflow-wrap:anywhere;min-width:7em}
.relname{display:inline-flex;align-items:center;gap:6px}
.chip{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;margin:2px 4px 2px 0;border:1px solid var(--kin);border-radius:2px;color:var(--kin)}
.tension{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tension b{font-weight:600}
.tension.t3 b,.tension.t4 b,.tension.t5 b{color:var(--blood)}
.tension.t0 b{color:var(--accent)}
.stance{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding-top:6px;border-top:1px solid var(--line)}
.threat{margin:0;font-size:15px}
ul.ties{list-style:none;margin:0;padding:0;display:grid;gap:2px}
ul.ties li.good::before{content:"+ ";color:var(--accent);font-weight:700}
ul.ties li.bad::before{content:"− ";color:var(--blood);font-weight:700}
ul.ties li.warn::before{content:"! ";color:var(--gold);font-weight:700}
.theirs{padding-top:6px;border-top:1px dashed var(--line)}
details.hist{font-size:15px}
details.hist summary{cursor:pointer;color:var(--muted);font-weight:600;min-height:32px;display:flex;align-items:center}
details.hist ul{margin:4px 0 0;padding-left:18px;display:grid;gap:4px}

details.ravens[open] summary::before{transform:rotate(90deg)}

.ravens-none{margin:10px 0 0;font-size:15px}

/* folding sections, web, rankings */
.fold>details>summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;cursor:pointer;list-style:none;min-height:36px}

.fold>details>summary h2{margin:0}
.fold>details>summary::before{content:"▸";color:var(--gold);font-size:16px;transition:transform .15s;align-self:center}
.fold>details[open]>summary::before{transform:rotate(90deg)}
.foldbody{margin-top:12px}
.webwrap{overflow-x:auto}

.e-ally{stroke:var(--accent);opacity:.7}

.e-favor{stroke:var(--gold);stroke-dasharray:3 6;stroke-width:3}

ul.mods{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:15px}

.confirm.col{flex-direction:column;align-items:flex-start}

.terms{display:grid;gap:10px;margin:0 0 12px}

.allycard{border-color:var(--accent)}

<script>
/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

/* ---------- rules ---------- */
/* Black Tapestry's five stats doing Avelon's jobs: Accuracy fights, Stature takes wounds, Endurance survives,
   Proficiency talks, Cybernetics does the hard skills */
const STATS=['Stature','Proficiency','Accuracy','Cybernetics','Endurance'];
const STAT_HELP={
  Stature:'Health. Stature plus armor is how many wounds a crew member can take before they go down. Roll it to stand firm or haul heavy cargo.',

  Endurance:'Survival. Roll a d10 at or under Endurance to endure hardship, shake off toxins, or live through a wound that should have killed.',
  Proficiency:'Social skills. Roll a d10 at or under Proficiency to persuade, deceive, bargain or read what someone truly wants.',
  Cybernetics:'Hard skills. Roll a d10 at or under Cybernetics to fix the ship, fly it, slip past security, hack a system or call in ship support.'
};
const SKILLS={
  Stature:['Stand firm','Haul','Intimidate'],
  Accuracy:['Firefight','Melee','Marksman'],
  Endurance:['Endure','Resist toxins','Vacuum drill'],
  Proficiency:['Persuade','Deceive','Bargain','Read intent'],
  Cybernetics:['Engineering','Piloting','Stealth','Hacking']
};
/* Black Tapestry's Armory: eight items per rank, ranks 1 to 5 (weapons and armor) */
const W_TIERS=[['“Fine Arts” Laser Carbine','Piccolo Plasma Revolver','Semi-Auto Pistol','Combat Knife','Revolver Pistol','Hand Crossbow','Butterfly Knife','Snappers'],
 ['“Deco” Pulse Rifle','Plasma Carbine','Slug Carbine','Combat Hatchet','.44 Revolver Pistol','Smart Pistol','Trench Knife','Pineapples'],
 ['“Courtesy” Beam Rifle','Plasma Rifle','Assault Rifle','Bow','Double-Barrel Shotgun','Marksman Rifle','Wolvers','Razor Boquets'],
 ['“Hailstone” Carpet Laser','Plasma Blade','Flachette Shotgun','Razor Wire','Flamethrower','Gauss Rifle','Power Gauntlets','Thermites'],
 ['Leviathan Rotolaser','Abyssal Halo','Sawtooth HMG','Ninjitsu','Anti-Material Rifle','Gravity Fists','Seekers']];
const A_TIERS=[['Deflector Pin','Electroshock Muscle Therapy','Anti-Ballistic Vest','Flack Jacket and Jeans','Broad-Spectrum Immunovirus','Combat Fatigues','Ammo Belts','Ad-Tier Chestpiece'],
 ['Deflector Shield','High-Density Bone Treatment','NeoCeramic Plate','Assault Shades','Metabolic Hyperfluid Injections','GI Armor','Resupply Armor','Branded Chestpiece'],

 ['Predictive Reflex Armor','Durodermis Skin Grafts','Prometheus Plate Armor','Juggernaut 3-Piece Suit','Regenerative Strain Injectable','Plasteel Armor','ODM Exoskeleton','Nades R We Armor'],
 ['“Bikini” Neural Implant Armor','Redundant Organs','Starmetal Armor','“Artiface” Power Armor','Genetic Conditioning','Ceremonial Armor','Rechargeable Laser Wings','Divine Disposables Armor']];

const wVal=n=>(WEAPONS.find(w=>w[0]===n)||WEAPONS[0])[1];
const aVal=n=>(ARMORS.find(w=>w[0]===n)||ARMORS[0])[1];
const maxWounds=m=>Math.max(1,m.st.Stature+aVal(m.gear.armor)+['heirloom','specialty'].reduce((a,k)=>a+(((k==='heirloom'?HEIRLOOMS:SPECIALTIES)[m.gear[k]]||{}).wounds||0),0));

const PHASE=4;

/* ---------- species ---------- */
/* internal keys are kept from the source game: Kin = Terran, Fey = Elgiem, Pel = Sluttle, Fur = Animatron */
const SPECIES={
  Fey:{name:'Elgiem',primary:'Proficiency',adult:24,old:150,male:.5,desc:'Little green folk with great domed heads and black almond eyes. Long-lived, and can talk their way through anything.'},
  Pel:{name:'Sluttle',primary:'Accuracy',adult:16,old:64,male:.25,desc:'Pale blue to violet, with tentacle arms that never lose their grip on a trigger. Average lifespans. Three in four are female.'},

};
const SPECIES_KEYS=['Kin','Fey','Pel','Fur'];
const spOf=m=>SPECIES[m&&m.sp]||SPECIES.Kin;
const isAdult=m=>m.age>=spOf(m).adult;
/* an age given in Terran years, turned into the same stage of life in a species' own years */
const toSpAge=(a,sp)=>{const S=SPECIES[sp]||SPECIES.Kin;return a<16?Math.max(0,Math.round(a*S.adult/16)):Math.round(S.adult+(a-16)*(S.old-S.adult)/44)};
/* a species' primary stat is never below 6: points move in from the highest other stats */
function enforcePrimary(st,sp,min){min=min||6;const p=(SPECIES[sp]||SPECIES.Kin).primary;
  while(st[p]<min){const donors=STATS.filter(k=>k!==p&&st[k]>2);if(!donors.length)break;const top=Math.max(...donors.map(k=>st[k]));const k=pick(donors.filter(x=>st[x]===top));st[k]--;st[p]++}}
const speciesLine=m=>{const S=spOf(m);return `${S.name}: ${S.desc} Primary stat ${S.primary} (marked ✦). Signs on from age ${S.adult}; starts thinking about retiring from ${S.old}.`};

/* ---------- names ---------- */

const PORTS=['Saperian Highport','Solace Ring','the Refuge shipyards','Rebirth Station','Big Stick Freeport','Hesper Station','Dock Nine at Solace','Bayle’s Rest','Kepler Freeport','the Tannhauser Ring','Greywater Anchorage','Port Meridian'];

const SEATS=PORTS;

const SHIP_NAMES=['Vigil','Long Shot','Second Dawn','Hesper’s Promise','Iron Lullaby','Kestrel','Last Light','Tenacity','Good Odds','Morning Star','Patience','Wayfarer','Black Tapestry','Quiet Thunder','Sparrowhawk','Lucky Penny','Saint Brigid','Far Harbor'];

const MALE=['Bram','Dov','Fen','Gus','Ivo','Kai','Milo','Oren','Quinn','Rafe','Teo','Vik','Wynn','Zed','Bodhi','Dax','Ilya','Nils','Remy','Soren','Marcus','Tomas','Andre','Hiro','Kofi','Mateo','Arjun','Luka','Emeka','Sami'];
const FEMALE=['Ada','Cass','Eira','Hana','Juno','Lena','Nia','Pia','Sana','Uma','Yara','Alix','Cyra','Esme','Mara','Odette','Tova','Vesper','Ines','Priya','Zara','Mei','Rosa','Freya','Imani','Leila','Noor','Tess'];

  Fey:{m:['Zib','Glorp','Quix','Ommo','Vrill','Tuk','Zebulox','Morb','Plaxo','Xun','Ib','Grenthis','Oolo','Kreeb','Zarn','Yib','Vobb','Nixtal','Bloq','Thurp'],
       f:['Zeela','Glimmi','Quessa','Omma','Vrilla','Tuva','Xanni','Ibbi','Plixie','Yoola','Zaavi','Kreela','Moxi','Ullari','Bix','Nebba','Ovi','Thessix','Qwee','Lumi']},
  Pel:{m:['Slooq','Murro','Gubbin','Wellum','Oozo','Brack','Squidley','Tentro','Loppo','Burble','Nemo','Coilin','Inkle','Barnab'],

/* ---------- sigils ---------- */
const TINCT={or:'#c9a23a',argent:'#e9e4d4',gules:'#9b1c1c',azure:'#2d4f8a',vert:'#2f6a3e',sable:'#1e1a18',purpure:'#5e3a6e'};
const METALS=['or','argent'],COLORS=['gules','azure','vert','sable','purpure'];
const ORDS=['plain','pale','fess','bend','chevron','perpale','quarterly','chief'];
const CHARGES=['mullet','roundel','lozenge','crescent','cross','tower','tree','anvil','paw','none'];
function newSigil(){const metalField=R()<.35;const field=metalField?pick(METALS):pick(COLORS);const other=metalField?pick(COLORS):pick(METALS);
  return {field,ord:pick(ORDS),ordC:other,charge:pick(CHARGES),chargeC:R()<.5?other:(metalField?pick(COLORS):pick(METALS))}}
function sigilSVG(s,uid){const cid='sh'+String(uid||'h').replace(/[^a-z0-9]/gi,'');

function statsFor(age,lean,spk){
  /* every crew member spreads 25 points; elders lose Accuracy; a species' primary stat starts at 6 or more */
  const S=SPECIES[spk]||SPECIES.Kin;
  const st={};STATS.forEach(k=>st[k]=2);let left=STAT_TOTAL-2*STATS.length;
  if(lean){const a=ri(3,4);st[lean[0]]+=a;left-=a;if(lean[1]){const b=ri(2,3);st[lean[1]]+=b;left-=b}}
  while(left>0){const k=pick(STATS);if(st[k]<10){st[k]++;left--}}
  enforcePrimary(st,spk);
  if(age>=S.old+2&&st.Accuracy>2){const d=Math.min(st.Accuracy-2,ri(1,3));st.Accuracy-=d;st.Proficiency=Math.min(10,st.Proficiency+d)}
  return st;
}
const topStat=st=>STATS.reduce((a,k)=>st[k]>st[a]?k:a,STATS[0]);

  /* o.age is given in Terran years and converted to the species' own */
  const sp=o.sp||'Kin',S=SPECIES[sp],age=toSpAge(o.age,sp);
  const sex=o.sex||(R()<S.male?'m':'f');
  const st=statsFor(age,o.lean,sp);

  const m={id:nextId++,given,sex,sp,age,title:o.title||'',origin:o.origin||'hired',from:o.from||'',joined:o.joined||1,
    ruler:!!o.ruler,st,wounds:0,dead:false,
    gear:{weapon:'None',armor:'None',heirloom:'',specialty:'',support:''},traits:traitsFor(sp),look:(Math.floor(R()*4294967295)>>>0)||1};
  m.kit=pick(KIT_BY[topStat(st)]);

  m.gear.armor=pick(['Accuracy','Stature','Endurance'].includes(top)?START_ARMOR.tough:START_ARMOR.other);

const ORIGIN_PILL={founder:'Founding crew',hired:'Signed on',recruit:'Recruit',prisoner:'Turned prisoner'};
function dossier(m){
  const mw=maxWounds(m),left=mw-m.wounds;

  if(m.givenTo)pills.push(`<span class="status kin">Transferred to the ${esc(m.givenTo)}</span>`);
  else if(m.retired||m.returned)pills.push(`<span class="status kin">${esc(m.fell||'Retired ashore')}</span>`);

  else if(m.captive)pills.push(`<span class="status bad">Held prisoner by the ${esc(m.captive.house)}</span>`);
  else if(m.wounds>=mw)pills.push('<span class="status bad">Gravely wounded</span>');
  else if(m.wounds>0)pills.push(`<span class="status bad">Wounded · ${left} left</span>`);
  else pills.push('<span class="status ok">Hale</span>');
  pills.push(`<span class="status kin">${spOf(m).name}</span>`);
  if(!m.dead&&m.ruler)pills.push('<span class="status young">Captain</span>');
  else if(!m.dead&&m.id===H.firstMate)pills.push('<span class="status young">First Mate · takes command if the captain falls</span>');
  else if(!m.dead&&heirOf()===m)pills.push('<span class="status young">Next in command · no First Mate named</span>');
  if(!m.dead&&m.onOp===H.cycle)pills.push('<span class="status young">On an operation this season</span>');
  if(ORIGIN_PILL[m.origin])pills.push(`<span class="status kin">${ORIGIN_PILL[m.origin]}</span>`);
  if(!m.dead&&!m.ruler&&m.id!==H.firstMate&&isAdult(m))pills.push(`<button class="sm" data-firstmate="${m.id}">Name First Mate</button>`);
  if(!m.dead&&m.age>=spOf(m).old)pills.push('<span class="status bad">Near retirement</span>');
  const trainRow=(m,k)=>{
    if(m.dead)return '';const n=queuedIn(m,k),top=m.st[k]+n,cost=nextTrainCost(m,k);
    const pos=trainQ(m).findIndex(t=>t.k===k);
    const q=n?`<span class="q">+${n} in training → ${top}</span>${m.captive?' <span class="paused">paused while captive</span>':` <span class="muted">· next +1 ${pos===0?'when the season ends':'in '+(pos+1)+' seasons'}</span>`} <button data-untrain="${k}" aria-label="Cancel ${k} training">Cancel (refund ${trainQ(m).filter(t=>t.k===k).reduce((a,t)=>a+t.cost,0)})</button>`:'';
    const buy=top>=10?'<span class="muted">At its height.</span>':`<button data-train="${k}" ${H.gold<cost?'disabled':''}>Train ${k} to ${top+1} · ${cost} credits</button>`;
    return `<div class="train">${buy}${q}</div>`};
  const stats=STATS.map(k=>{
    const v=m.st[k],bonus=(k==='Accuracy'?wVal(m.gear.weapon):0)+gearBonus(m,k);
    return `<span class="sn">${k}${k===spOf(m).primary?' ✦':''}</span><span class="pips" aria-label="${k} ${v} of 10">${Array.from({length:10},(_,i)=>`<i class="${i<v?'on':''}"></i>`).join('')}</span><span class="sv">${v}</span>
      <p class="help">${STAT_HELP[k]}</p>${trainRow(m,k)}`}).join('');
  let roll='';
  if(lastRoll&&lastRoll.id===m.id){const L=lastRoll;
    roll=`<p class="rolled ${L.ok?'hit':'miss'}" role="status">${esc(L.skill)} (${L.stat} ${L.base}${L.bonus?' + '+L.bonus+' gear':''}): rolled <b>${L.roll}</b> against ${L.target}. <span class="${L.ok?'hit':'miss'}">${L.ok?(L.roll===1?'A perfect success.':'Success by '+(L.target-L.roll)+'.'):(L.roll===10?'Disaster.':'Failure by '+(L.roll-L.target)+'.')}</span></p>`}
  else roll='<p class="rolled" role="status">Pick a skill to roll a d10. At or under the number succeeds.</p>';
  const hp=Array.from({length:mw},(_,i)=>`<i class="${i<m.wounds?'on':''} ${i>=m.st.Stature?'armor':''}" title="${i>=m.st.Stature?'From armor or gear':'From Stature'}"></i>`).join('');
  return `<div class="dhead">
      <div class="figs"><figure class="cam">${portrait(m,144)}<figcaption>${spOf(m).name} · ${m.sex==='m'?'He':'She'} · age ${m.age}</figcaption></figure><figure class="cam"><img class="pf" src="${bodyURL(m)}" width="144" height="144" alt=""><figcaption>${m.dead?'Off the roster':'Ready for a job'}</figcaption></figure>
        ${m.dead?'':`<button class="sm" data-relook="${m.id}">Redraw look</button>`}</div>
      <div style="min-width:0">
        <input class="given" id="given-${m.id}" data-edit="given" value="${esc(m.given)}" aria-label="Given name">
        <input class="mtitle" id="title-${m.id}" data-edit="title" value="${esc(m.title)}" aria-label="Title" placeholder="Title">
        <p class="origin">${origLine(m)}</p>
        <div class="pills">${pills.join('')}</div>
      </div></div>
    <h3>The five stats</h3><p class="muted" style="margin:0 0 8px;font-size:17px">${esc(speciesLine(m))}</p>
    <div class="stats">${stats}</div>
    <h3>Health</h3>
    <div class="health"><span class="hp" aria-label="${m.wounds} of ${mw} wounds taken">${hp}</span>
      <span class="muted">${m.wounds} of ${mw} wounds · Stature ${m.st.Stature}${aVal(m.gear.armor)?' + armor '+aVal(m.gear.armor):''}${(fxH(m).wounds||0)+(fxS(m).wounds||0)?' '+((fxH(m).wounds||0)+(fxS(m).wounds||0)>0?'+':'−')+' gear '+Math.abs((fxH(m).wounds||0)+(fxS(m).wounds||0)):''}</span>
      <span style="display:flex;gap:6px"><button data-wound="1" ${m.wounds>=mw?'disabled':''}>Take a wound</button><button data-wound="-1" ${m.wounds<=0?'disabled':''}>Heal one</button></span></div>
    <h3>Gear</h3>
    <div class="slots">
      ${GEAR_SLOTS.map(k=>`<div class="slot"><label for="g${k}-${m.id}">${ITEM_SLOTS[k]}</label><select id="g${k}-${m.id}" data-gear="${k}" ${m.dead?'disabled':''}>${gearOptions(m,k)}</select><small>${m.gear[k]&&m.gear[k]!=='None'?esc(itemDesc(k,m.gear[k])):'Buy more at the Market.'}</small></div>`).join('')}

}

/* ---------- war & alliances ---------- */
function ensureDip(){

const warWith=n=>H.dip?H.dip.wars.find(w=>w.house===n):null;

function newWar(n,o){return Object.assign({house:n,since:H.cycle,by:'you',cause:'',just:true,allies:[],wins:0,losses:0},o)}

/* ---------- go-betweens: a crew member of age rolls Proficiency, plus or minus how the other fleet leans; away for the season ---------- */
const TENSION_MOD=[1,0,-1,-2,-3,-4];
function envoyMods(kind,n,against){
  const r=rival(n);if(!r)return {block:'That fleet is gone.'};
  const M=[],add=(l,v)=>{if(v)M.push([l,v])},h=r.hostility,you=playerPower();
  if(H.dip.heard[n]===H.cycle)return {block:`The ${n} have already heard a go-between this season.`};
  if(kind==='ally'){
    if(atWar(n))return {block:'You are at war with them. Sue for peace first.'};
    if(alliedWith(n))return {block:'They are already your allies.'};
    if(h>=4)return {block:`Tension is ${TENSION[h].toLowerCase()}. Ease it before proposing an alliance.`};
    const fa=warFoes().find(f=>relation(f,n)==='ally');if(fa)return {block:`They are allied with the ${fa}, your enemies.`};
    add(`Tension: ${TENSION[h]}`,TENSION_MOD[h]);
    if(H.pacts.some(p=>p.house===n&&p.kind.startsWith('Truce')))add('A truce',1);
    if(H.pacts.some(p=>p.house===n&&(p.kind==='Crew pact'||p.kind==='Partnership bond')))add('A crew pact',1);
    if(H.pacts.some(p=>p.house===n&&p.dowered))add('A signed contract',1);
    if(hasRoute(n))add('You run cargo on their lanes',1);
    warFoes().filter(f=>relation(f,n)==='war').forEach(f=>add(`A common enemy: the ${f}`,2));
    add('Your strength against theirs',clamp(you-r.power,-2,1));
    if(H.influence>=6)add('Your Rep in the sector',1);
    if(r.agenda==='crown')add('They want your clients',-1);
  }else if(kind==='call'){
    const e=rival(against);if(!e)return {block:'That enemy is gone.'};
    if(!alliedWith(n))return {block:'They are not your allies.'};
    if(relation(n,against)==='ally')return {block:`They are allied with the ${against} and will not fight them.`};
    if(warAllies(against).includes(n))return {block:'They already fight beside you.'};
    add('Bound by your alliance',2);
    add(`Tension: ${TENSION[h]}`,TENSION_MOD[h]);
    if(relation(n,against)==='war')add(`Already at war with the ${against}`,3);
    add(`Their strength against the ${against}`,clamp(r.power-e.power,-2,2));
    if(r.agenda==='land')add('Hungry for ships',1);
    if(r.agenda==='wealth')add('Loath to spend credits on a war',-1);
    H.rivals.filter(o=>o.name!==against&&relation(n,o.name)==='war').forEach(o=>add(`Already fighting the ${o.name}`,-1));
  }else if(kind==='peace'){
    const w=warWith(n);if(!w)return {block:'You are not at war with them.'};
    if(h>=4)add(`Tension: ${TENSION[h]}`,h>=5?-2:-1);
    add(`The war so far: ${w.wins} won, ${w.losses} lost`,clamp(w.wins-w.losses,-3,3));
    const len=Math.max(0,H.cycle-w.since);add(`War-weariness: ${len} season${len===1?'':'s'}`,Math.min(2,Math.floor(len/3)));
    add('Your strength and allies against theirs',clamp(you+warAllies(n).length-r.power,-2,2));
    if(r.agenda==='wealth')add('Counting the cost of the war',1);
    if(r.agenda==='revenge')add('Bent on revenge',-1);
    if(H.secrets.some(s=>s.house===n))add('You hold their secrets',1);
  }
  return {mods:M,sum:M.reduce((a,x)=>a+x[1],0)};
}
const envoyBase=m=>m.st.Proficiency+gearBonus(m,'Proficiency','Trade');

/* ---------- terms demanded of you: when you are losing, each enemy sends terms once a year, at Perihelion ---------- */
const bestLand=()=>H.lands.slice().sort((a,b)=>b.income-a.income||tierStep(b)-tierStep(a))[0]||null;
const statSum=m=>STATS.reduce((a,k)=>a+m.st[k],0);
function enemyDemand(w,say){
  const r=rival(w.house),m=w.losses-w.wins;if(!r||w.since>H.cycle||m<2||H.dip.demands.some(x=>x.house===w.house))return;
  if(!H.lands.length&&m>=4){H.dip.demands.push({house:w.house,terms:{dissolve:true},due:H.cycle+1});say(`The ${w.house} hold every advantage and demand that your fleet break up. Answer in The Sector this Perihelion.`,'bad');return}

  const terms={};shuffle(opts).slice(0,want).forEach(k=>{
    if(k==='gold')terms.gold=Math.min(H.gold,6+3*r.power+2*m);
    if(k==='land')terms.land=bestLand().name;});
  H.dip.demands.push({house:w.house,terms,due:H.cycle+1});

}

  if(t.land){const L=H.lands.find(l=>l.name===t.land)||bestLand();if(L)out.push(`Hand over ${esc(L.name)}, your ${esc(L.tier.toLowerCase())} (+${landIncome(L)} credits a season)`)}

}

function acceptDemand(i){

  if(t.land){const L=H.lands.find(l=>l.name===t.land)||bestLand();if(L){H.lands.splice(H.lands.indexOf(L),1);refundBuild(L,s=>done.push(s));if(r)r.lands++;done.push(`${L.name} handed over`)}}

  if(mem(sel)&&mem(sel).givenTo){const ru=H.members.find(m=>m.ruler&&!m.dead);if(ru)sel=ru.id}

/* ---------- splitting up a fleet: you claim their last ship or their flagship; a new fleet moves in ---------- */
function dissolveHouse(n,out,claim){
  const r=rival(n);if(!r)return;const d=H.dip;claim=claim||'flagship';
  let L;
  if(claim==='ship')L={name:shipName(),tier:'Freighter',income:5,peasants:40+ri(0,10),from:n,cycle:H.cycle};
  else L={name:r.flag||shipName(),tier:'Frigate',income:8,peasants:80+ri(0,20),from:n,cycle:H.cycle};
  H.lands.push(L);H.influence+=3;bumpOthers(n);
  d.wars=d.wars.filter(w=>w.house!==n);d.wars.forEach(w=>{w.allies=w.allies.filter(a=>a!==n)});
  d.allies=d.allies.filter(a=>a.house!==n);d.truces=d.truces.filter(t=>t.house!==n);
  d.calls=d.calls.filter(c=>c.from!==n&&c.against!==n);d.demands=d.demands.filter(x=>x.house!==n);delete d.heard[n];d.griev=d.griev.filter(g=>g.house!==n);
  H.realm.alliances=H.realm.alliances.filter(k=>!k.split('|').includes(n));H.realm.wars=H.realm.wars.filter(k=>!k.split('|').includes(n));
  Object.keys(H.realm.warFrom||{}).forEach(k=>{if(k.split('|').includes(n))delete H.realm.warFrom[k]});
  d.routes=d.routes.filter(x=>x.house!==n);d.embargo=d.embargo.filter(x=>x!==n);d.embargoedBy=d.embargoedBy.filter(x=>x.house!==n);
  H.pacts=H.pacts.filter(p=>p.house!==n);
  H.secrets=H.secrets.filter(x=>x.house!==n);H.plans=H.plans.filter(x=>x.house!==n);H.informants=H.informants.filter(x=>x.house!==n);
  const freed=H.captives.filter(c=>c.house===n).length;H.captives=H.captives.filter(c=>c.house!==n);
  H.members.forEach(m=>{if(m.captive&&m.captive.house===n&&!m.dead){m.captive=null;out.push(`${m.given} is let out of their brig and comes home`)}});
  H.ops.board=H.ops.board.filter(o=>o.target!==n);H.ops.defense=(H.ops.defense||[]).filter(o=>o.target!==n);
  out.push(`The ${n} are split up. Their crews scatter and their ships change hands`);
  out.push(`You claim ${claim==='flagship'?'their flagship':'their last ship'}, ${L.name}, as your ${L.tier.toLowerCase()}: +${L.income} credits each season, ${L.peasants} hands`);
  out.push('+3 Rep. Every other fleet grows warier of you');
  if(freed)out.push(`${freed} of their people in your brig are turned loose`);
  H.log.push({cycle:H.cycle,text:`You split up the ${n} and claim ${L.name}.`});
  replaceHouse(r);
  out.push(`A new fleet moves into the sector: the ${r.name}, ${kindOf(r).label.toLowerCase()}, out of ${r.seat}`);
}

/* ---------- the war & alliances panel ---------- */

  const r=rival(w.house);if(!r)return '';
  const fight=warAllies(w.house),idle=H.dip.allies.map(a=>a.house).filter(a=>!fight.includes(a)&&rival(a)&&relation(a,w.house)!=='ally');
  const ap=Math.min(3,fight.reduce((s,a)=>s+rival(a).power,0)),heard=x=>H.dip.heard[x]===H.cycle;
  return `<article class="hcard warcard"><div class="hhead"><i class="kbadge" style="background:${KIND_COLOR[r.kind]}"></i><div style="min-width:0;flex:1"><h3>War with the ${esc(r.name)}</h3>
      <p class="muted" style="margin:0;font-size:15px">${w.since>H.cycle?'Begins this season':'Since '+seasonOf(w.since)+', year '+yearOf(w.since)} · ${WAR_BY[w.by]||''}</p></div></div>
    <dl class="opdl"><dt>Cause</dt><dd>${w.just?esc(w.cause):'<span class="hot">No just cause</span>'}</dd>
      <dt>Strength</dt><dd>Yours ${playerPower()}${ap?` + allies ${ap}`:''} against their ${r.power} <span class="muted">· plus a d6 each, every season</span></dd>
      <dt>Beside you</dt><dd>${fight.length?fight.map(a=>'the '+esc(a)).join(', '):'<span class="muted">No one yet</span>'}</dd>

    <div class="acts"><button class="sm" data-treaty="${esc(w.house)}" ${heard(w.house)||talksOn(w.house)?'disabled title="They have heard go-betweens this season"':''}>Negotiate peace · go-betweens</button>${idle.map(a=>`<button class="sm" data-envoy="call|${esc(a)}|${esc(w.house)}" ${heard(a)?'disabled title="They have heard a go-between this season"':''}>Call the ${esc(a)} to arms · go-between</button>`).join('')}</div></article>`;
}

  const d=H.dip;
  const last=d.last&&d.last.cycle===H.cycle?`<p class="rolled ${d.last.ok?'hit':'miss'}" role="status" style="margin-bottom:10px">${esc(d.last.text)}</p>`:'';
  const calls=d.calls.length?`<h3>Calls to arms</h3><ul class="offices">${d.calls.map((c,i)=>{const r=rival(c.against),oaths=r?oathsWith(c.against):[];
    return `<li><span style="flex:1;min-width:0"><b>The ${esc(c.from)} call you to arms against the ${esc(c.against)}</b><br><span class="muted" style="font-size:15px">Answering starts a war on the ${esc(c.against)} with just cause, and the ${esc(c.from)} fight beside you.${oaths.length?` <span class="hot">It breaks ${esc(oaths.join(' and '))} with them.</span>`:''} Refusing, or leaving it past the season, costs ${H.influence>=2?'2 Rep':'the alliance (you have under 2 Rep)'}.</span></span>
      <span class="acts"><button class="sm main" data-answer="${i}" ${inTruce(c.against)?'disabled title="A truce holds with them"':''}>Answer the call</button><button class="sm" data-refuse="${i}">Refuse</button></span></li>`}).join('')}</ul>`:'';

  const allies=d.allies.filter(a=>rival(a.house));
  const allyHtml=allies.length?`<ul class="offices">${allies.map(a=>{const r=rival(a.house),theirWars=H.rivals.filter(o=>relation(a.house,o.name)==='war').map(o=>'the '+o.name);
    return `<li><i class="kbadge" style="background:${KIND_COLOR[r.kind]}"></i><span style="flex:1;min-width:0"><b>The ${esc(a.house)}</b><br><span class="muted" style="font-size:15px">Allied since ${seasonOf(a.since)}, year ${yearOf(a.since)} · power ${'◆'.repeat(r.power)} · ${TENSION[r.hostility]}${theirWars.length?' · <span class="hot">at war with '+esc(theirWars.join(', '))+'</span>':''}</span></span>
      ${pendingBreak===a.house?`<span class="acts"><button class="sm danger" data-breakyes="${esc(a.house)}">End it · +2 tension</button><button class="sm" data-breakno="1">Keep it</button></span>`:`<button class="sm" data-breakally="${esc(a.house)}">End the alliance</button>`}</li>`}).join('')}</ul>`:'<p class="muted" style="margin:0">No allies yet. Send a go-between from a fleet’s card below to propose an alliance.</p>';
  const sum=[d.demands.length?`${d.demands.length} demand${d.demands.length>1?'s':''} for peace`:'',wars.length?`${wars.length} war${wars.length>1?'s':''}`:'',allies.length?`${allies.length} all${allies.length>1?'ies':'y'}`:'',d.calls.length?`${d.calls.length} call${d.calls.length>1?'s':''} to arms`:''].filter(Boolean).join(' · ')||'At peace';
  return `<section class="pane fold dip ${wars.length||d.calls.length||d.demands.length?'crisis':''}"><details data-fold="diplo" ${foldOpen('diplo')?'open':''}><summary><h2>War &amp; alliances</h2><span class="muted">${sum}</span></summary><div class="foldbody">
    <p class="muted" style="font-size:15px;margin:0 0 10px">Go-betweens are crew of age you send to another fleet. They roll Proficiency, shifted by how that fleet leans toward you, and are away for the season. Each fleet hears one go-between a season. At war, both sides clash every season, power against power, and war operations against your enemies come up at Aphelion and on the Descent. Peace is negotiated: the harsher your terms, the more dangerous the talks. An enemy that is winning sends its terms each Perihelion. Truces hold.</p>
    ${last}${demandsHtml()}${calls}${talksHtml()}<h3>Wars</h3>${warHtml}<h3>Alliances</h3>${allyHtml}</div></details></section>`;

function dipActs(r){
  const n=r.name,b=[];
  if(atWar(n))b.push(`<button class="sm" data-treaty="${esc(n)}" ${talksOn(n)?'disabled title="Talks are already underway"':''}>Negotiate peace · go-betweens</button>`);
  else{
    if(!alliedWith(n))b.push(`<button class="sm" data-envoy="ally|${esc(n)}">Propose an alliance · go-between</button>`);
    if(inTruce(n))b.push(`<span class="muted" style="font-size:14px;align-self:center">A truce: no war until ${seasonOf(H.dip.truces.find(t=>t.house===n).until)}</span>`);
    else b.push(`<button class="sm danger" data-warask="${esc(n)}">Go to war</button>`);
    H.rivals.filter(o=>o!==r&&relation(n,o.name)==='war'&&!atWar(o.name)&&!alliedWith(o.name)&&!inTruce(o.name)).forEach(o=>b.push(`<button class="sm" data-joinwar="${esc(n)}|${esc(o.name)}">Join their war on the ${esc(o.name)}</button>`));
  }
  return b.join('');
}
function warConfirm(r){
  if(!pendingWar||pendingWar.card!==r.name)return '';
  const tgt=rival(pendingWar.house);if(!tgt)return '';const n=tgt.name;
  const C=pendingWar.with?[`Joining the ${pendingWar.with}’s war on them`]:causesAgainst(tgt),oaths=oathsWith(n);
  const theirAllies=H.rivals.filter(o=>o.name!==n&&relation(o.name,n)==='ally'&&!alliedWith(o.name)&&!atWar(o.name)).map(o=>'the '+o.name);
  const lines=[C.length?`<p><b class="okc">Just cause:</b> ${esc(C.join('; '))}.</p>`:'<p><b class="hot">No just cause.</b> −2 Rep, and every other fleet grows warier (+1 tension).</p>'];
  if(oaths.length)lines.push(`<p class="hot">You are bound to them by ${esc(oaths.join(' and '))}. Going to war breaks it: −1 Rep and +1 tension with every other fleet.</p>`);
  if(theirAllies.length)lines.push(`<p>Their allies may join them against you: ${esc(theirAllies.join(', '))}.</p>`);
  lines.push('<p class="muted">Every season the two of you clash, power against power. War operations against them come up at Aphelion and on the Descent. Peace must be negotiated by go-betweens.</p>');
  return `<div class="confirm col" role="alert"><b>Go to war with the ${esc(n)}?</b>${lines.join('')}<div class="acts"><button class="sm danger" data-wargo="1">Go to war</button><button class="sm" data-warno="1">Hold off</button></div></div>`;
}

/* ---------- leverage: blackmail and leaks ---------- */
function blackmail(i,demand){
  const s=H.secrets[i];if(!s)return;const r=rival(s.house);H.secrets.splice(i,1);let t;
  if(demand==='gold'){const g=6+2*(r?r.power:1);H.gold+=g;t=`The ${s.house} pay ${g} credits to keep a secret buried.`}
  else if(demand==='peace'){H.pacts.push({house:s.house,kind:'Truce (coerced)'});if(r)r.hostility=0;t=`The ${s.house} agree to a truce rather than see their secret get out.`}
  else if(demand==='match'){H.offers.push({house:s.house,cycle:H.cycle});t=`The ${s.house} offer recruits to keep you quiet. Choose in Crew Ties.`}
  bump(r,1);H.log.push({cycle:H.cycle,text:'Blackmail. '+t+' They will resent it.'});leverage=null;render();
}
function expose(i){
  const s=H.secrets[i];if(!s)return;const r=rival(s.house);H.secrets.splice(i,1);
  if(r)r.power=Math.max(1,r.power-1);bump(r,2);H.influence++;
  H.log.push({cycle:H.cycle,text:`You leak it all over the sector: ${s.text}. Their power falls, and your Rep rises.`});leverage=null;render();
}
function calm(n){const r=rival(n);if(!r||H.influence<2||!r.hostility)return;H.influence-=2;r.hostility--;H.log.push({cycle:H.cycle,text:`A few favors and a round of drinks ease tensions with the ${n}.`});render()}

/* ---------- power rankings ---------- */
function playerPower(){const hale=living().filter(m=>isAdult(m)&&!m.captive).length;return clamp(Math.round(hale/3),1,3)}
function powerOf(n){return n===H.house.name?playerPower():(rival(n)||{power:1}).power}
function landsOf(n){return n===H.house.name?H.lands.length+1:(rival(n)||{lands:0}).lands}
function alliesOf(n){
  if(n===H.house.name)return [...new Set(H.pacts.filter(BINDING).map(p=>p.house).concat(H.dip.allies.map(a=>a.house)))].filter(x=>rival(x)&&!atWar(x));
  const a=H.rivals.filter(o=>o.name!==n&&relation(n,o.name)==='ally').map(o=>o.name);
  if(!atWar(n)&&(H.pacts.some(p=>p.house===n&&BINDING(p))||alliedWith(n)))a.push(H.house.name);
  return a;
}
const crewLabel=n=>n===H.house.name?`The ${H.house.ship}`:`The ${n}`;
function rankings(){
  const names=[H.house.name].concat(H.rivals.map(r=>r.name));
  return names.map(n=>{const allies=alliesOf(n),ap=allies.reduce((a,x)=>a+powerOf(x),0),pw=powerOf(n),ln=landsOf(n);
    return {name:n,you:n===H.house.name,power:pw,lands:ln,allies,ap,score:pw*3+ln+ap}})
    .sort((a,b)=>b.score-a.score||b.power-a.power).map((x,i)=>Object.assign(x,{rank:i+1}));
}
function rankingsTable(){
  const R=rankings(),top=Math.max(...R.map(x=>x.score),1);
  return `<p class="muted" style="font-size:15px;margin:0 0 10px">Score = power × 3, plus ships in the fleet (your flagship counts as one), plus the power of every ally. Your power comes from how many crew of age are free to fight.</p>
  <ol class="ranks">${R.map(x=>{const r=rival(x.name);
    return `<li class="${x.you?'you':''}"><span class="rk">${x.rank}</span><i class="kbadge" style="background:${x.you?'var(--ink)':KIND_COLOR[r.kind]}"></i>
      <span class="rname"><b>${esc(crewLabel(x.name))}${x.you?' <span class="muted">(you)</span>':''}</b><span class="muted">Power ${'◆'.repeat(x.power)} · ${x.lands} ship${x.lands===1?'':'s'}${x.allies.length?' · allied with '+x.allies.map(a=>esc(crewLabel(a))).join(', '):''}</span></span>
      <span class="rbar" aria-hidden="true"><i style="width:${Math.round(x.score/top*100)}%"></i></span><b class="rscore">${x.score}</b></li>`}).join('')}</ol>`;
}
function foldOpen(k){return !(H.ui&&H.ui.folds&&H.ui.folds[k]===false)}

function realmView(){
  const news=H.news.length?`<section class="pane fold "><details data-fold="news" ${foldOpen('news')?'open':''}><summary><h2>Comms: ${seasonOf(H.cycle)}, year ${yearOf(H.cycle)}</h2><span class="muted">${H.news.length} message${H.news.length>1?'s':''}</span></summary><div class="foldbody"><ul class="news">${H.news.map(n=>`<li class="${n.tone}">${esc(n.t)}</li>`).join('')}</ul></div></details></section>`:'';
  const houses=H.rivals.map(houseCard).join('');
  return `${news}${envoyPanel()}${treatyPanel()}${diploView()}${tradeView()}
    <section class="pane fold"><details data-fold="rank" ${foldOpen('rank')?'open':''}><summary><h2>Power rankings</h2></summary><div class="foldbody">${rankingsTable()}</div></details></section>
    <section class="pane fold "><details data-fold="relations" ${foldOpen('relations')?'open':''}><summary><h2>Your fleet and the rivals</h2></summary><div class="foldbody"><p class="muted" style="font-size:15px;margin:0 0 10px">Tension rises when you hit a fleet or are caught scheming, and cools with time, favors and truces. A fleet that is not held in check by a truce, a crew pact or an alliance may strike at you between seasons.</p>${relationsOverview()}</div></details></section>
    <section class="pane fold "><details data-fold="houses" ${foldOpen('houses')?'open':''}><summary><h2>The fleets in detail</h2></summary><div class="foldbody"><div class="hgrid">${houses}</div></div></details></section>`;

/* ---------- the crew: command, aging and retirement. There are no families aboard ---------- */
const living=()=>H.members.filter(m=>!m.dead);
function ensureBlood(){
  if(!Array.isArray(H.informants))H.informants=[];if(!Array.isArray(H.ties))H.ties=[];if(!H.tiesRolled){H.tiesRolled=true;rollTies()}
  if(H.fallen===undefined)H.fallen=false;H.regency=null;
  H.members.forEach(m=>{if(m.joined==null)m.joined=1});
  if(H.firstMate===undefined){const fm=living().find(m=>!m.ruler&&m.title==='First Mate'&&isAdult(m));H.firstMate=fm?fm.id:null}
}
/* who takes command if the captain falls: the First Mate, then the longest-serving hands */
function lineOfSuccession(){
  const r=H.members.find(m=>m.ruler&&!m.dead);
  const pool=living().filter(m=>m!==r&&isAdult(m)&&!m.captive);
  const fm=pool.find(m=>m.id===H.firstMate);
  return (fm?[fm]:[]).concat(pool.filter(m=>m!==fm).sort((a,b)=>(a.joined||1)-(b.joined||1)||b.age-a.age));
}
const heirOf=()=>lineOfSuccession()[0]||null;
function setFirstMate(id){
  const m=mem(id);if(!m||m.dead||m.ruler||!isAdult(m)||H.firstMate===id)return;
  const old=H.firstMate!=null?mem(H.firstMate):null;
  if(old&&!old.dead&&old.title==='First Mate')old.title=roleFor(old.st);
  H.firstMate=id;m.title='First Mate';
  H.log.push({cycle:H.cycle,text:`${m.given} is named First Mate of the ${H.house.ship}${old&&!old.dead?`, in place of ${old.given}`:''}.`});
}
/* ---------- training: pay 2x the stat per +1; one +1 lands per member each season, in purchase order ---------- */
const trainQ=m=>m.train||(m.train=[]);
const queuedIn=(m,k)=>trainQ(m).filter(t=>t.k===k).length;
const nextTrainCost=(m,k)=>2*(m.st[k]+queuedIn(m,k));
function buyTraining(m,k){
  if(!m||m.dead)return;const cost=nextTrainCost(m,k);
  if(m.st[k]+queuedIn(m,k)>=10||H.gold<cost)return;
  H.gold-=cost;trainQ(m).push({k,cost});
  H.log.push({cycle:H.cycle,text:`Paid ${cost} gold to train ${m.given}'s ${k}.`});
}
function cancelTraining(m,k){
  const q=trainQ(m),gone=q.filter(t=>t.k===k);if(!gone.length)return;
  const back=gone.reduce((a,t)=>a+t.cost,0);m.train=q.filter(t=>t.k!==k);H.gold+=back;
  H.log.push({cycle:H.cycle,text:`Cancelled ${m.given}'s ${k} training. ${back} gold refunded.`});
}
function settleTraining(){ /* the dead are refunded in full */
  H.members.forEach(m=>{if(m.dead&&m.train&&m.train.length){const back=m.train.reduce((a,t)=>a+t.cost,0);m.train=[];H.gold+=back;
    H.log.push({cycle:H.cycle,text:`${m.given}'s unfinished training is refunded: ${back} gold.`})}});
}
function trainingTurn(){
  settleTraining();
  H.members.forEach(m=>{if(m.dead||m.captive||!m.train||!m.train.length)return;
    const steps=hasBoon(m,'tutor')?2:1;
    for(let s=0;s<steps&&m.train.length;s++){const t=m.train.shift();
    if(m.st[t.k]<10){m.st[t.k]++;m.trainedPts=(m.trainedPts||0)+1;H.log.push({cycle:H.cycle,text:`Training pays off${s?' (personal trainer)':''}: ${m.given}'s ${t.k} rises to ${m.st[t.k]}.`})}
    else{H.gold+=t.cost;H.log.push({cycle:H.cycle,text:`${m.given}'s ${t.k} is already at its height. ${t.cost} gold refunded.`})}}
  });
}
/* each new year: everyone ages, elders lose their edge, and those past their species' old age may retire ashore */
function retire(m,say){
  GEAR_SLOTS.forEach(s=>{const g=m.gear[s];if(g&&g!=='None')H.armory.push({slot:s,name:g});m.gear[s]=s==='weapon'||s==='armor'?'None':''});
  m.dead=true;m.retired=true;m.fell=`Retired ashore at ${m.age}, year ${yearOf(H.cycle+1)}`;clearTies(m.id);
  if(H.firstMate===m.id)H.firstMate=null;
  say(`${m.given} retires ashore at ${m.age}${m.ruler?' and hands over command':''}, with the crew’s thanks. Their gear goes back to the hold.`,'warn');
}
function agingTurn(say){
  living().forEach(m=>{
    m.age++;
    if(m.age>=spOf(m).old+2&&m.st.Accuracy>1&&Math.random()<.35)m.st.Accuracy--;
    if(m.age>=spOf(m).old&&!m.captive&&Math.random()<(m.age-spOf(m).old+2)*.03)retire(m,say);
  });
}
/* when the captain falls or retires: the First Mate takes command, or else the longest-serving hand */
function checkSuccession(){
  if(H.fallen)return;
  if(H.firstMate!=null){const f=mem(H.firstMate);if(!f||f.dead||f.ruler)H.firstMate=null}
  const r=H.members.find(m=>m.ruler);
  if(r&&!r.dead)return;
  const heir=heirOf()||living().sort((a,b)=>b.age-a.age)[0];
  if(r)r.ruler=false;
  if(!heir){H.fallen=true;H.log.push({cycle:H.cycle,text:`No one is left aboard the ${H.house.ship}. She goes dark.`});return}
  const wasFm=heir.id===H.firstMate,old=r?r.given:'the old captain';
  heir.ruler=true;heir.title='Captain';H.firstMate=null;
  const t=`With ${old} ${r&&r.retired?'retired':'gone'}, ${heir.given}${wasFm?', the First Mate,':', the longest-serving hand,'} takes command of the ${H.house.ship}. Name a new First Mate in Crew Ties.`;
  H.log.push({cycle:H.cycle,text:t});H.news=(H.news||[]).concat([{t,tone:r&&r.retired?'warn':'bad'}]);
}

/* ---------- recruitment offers from other fleets: a green hand, a seasoned hand and a veteran; better hands ask a bigger signing fee ---------- */
const RECRUIT_TIER=[['Green hand',0,6],['Seasoned hand',2,6],['Veteran',4,7]]; /* label, stat points over a founding hand's, primary minimum */
const signingFee=(r,t)=>{const p=r?r.power:1;return [0,6+2*p,12+4*p][t]||0};
const offerFee=(o,s)=>o.treaty?0:signingFee(rival(o.house),s.tier);
/* what a fleet pays you to take one of your hands: by their power */
function transferFor(r){
  const p=r?r.power:1;
  if(p>=3)return {kind:'land',text:'A shuttle as their transfer fee'};
  if(p===2)return {kind:'pact',text:'A small cargo contract worth 2 credits each season'};
  return {kind:'gold',text:'A transfer fee of 8 credits'};
}
function takeTransferFee(o,r){
  const d=transferFor(r);
  if(d.kind==='gold'){H.gold+=8;return '8 credits'}
  if(d.kind==='pact'){addRoute(o.house,2,'small');return 'a small cargo contract worth 2 credits each season'}
  const L={name:shipName(),tier:'Shuttle',income:2,peasants:14+ri(0,3),from:o.house,cycle:H.cycle};H.lands.push(L);if(r)r.lands=Math.max(0,r.lands-1);return `the shuttle ${L.name}`;
}
function ensureOfferIds(){H.offerSeq=H.offerSeq||1;H.offers.forEach(o=>{if(!o.uid)o.uid=H.offerSeq++})}

/* ---------- ties between crew: Friends and Rivals. A few are rolled at the start; the rest are earned on operations ---------- */
const TIE_NAME={F:'Friend',R:'Rival'};
const tieKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;

  const ad=living().filter(m=>isAdult(m));
  ad.forEach(m=>{if(Math.random()>=.5)return;const o=pick(ad.filter(x=>x!==m&&!tieOf(m.id,x.id)));if(o)setTie(m.id,o.id,Math.random()<.65?'F':'R')});

/* after an operation: success may make Friends of teammates, failure may make Rivals or break a friendship */
function opTies(ms){
  if(!ms||ms.tied||PHASE<4)return;ms.tied=true;
  const team=ms.team.map(mem).filter(m=>m&&!m.dead&&isAdult(m));
  if(team.length<2)return;
  const pairs=[];team.forEach((a,i)=>team.slice(i+1).forEach(b=>pairs.push([a,b])));
  const out=[];
  if(ms.grade==='full'||ms.grade==='partial'){
    pairs.forEach(([a,b])=>{const t=tieOf(a.id,b.id);
      if(!t&&Math.random()<(ms.grade==='full'?.25:.1)){setTie(a.id,b.id,'F');out.push(`${a.given} and ${b.given} come out of it as Friends`)}
      else if(t==='R'&&ms.grade==='full'&&Math.random()<.2){setTie(a.id,b.id,null);out.push(`${a.given} and ${b.given} bury their rivalry`)}});
  }else{
    const [a,b]=pick(pairs),t=tieOf(a.id,b.id);

      if(t==='F'){setTie(a.id,b.id,null);out.push(`${a.given} and ${b.given} fall out over it`)}
      else if(!t){setTie(a.id,b.id,'R');out.push(`${a.given} and ${b.given} blame each other: Rivals now`)}}

finishOp=(f=>function(ms){f(ms);opTies(ms)})(finishOp);

  const li=T.map(({m:o,t})=>`<li><span class="tk ${t==='F'?'okc':'hot'}">${TIE_NAME[t]}</span><button data-sel="${o.id}">${esc(fullName(o))}</button> <span class="muted">· ${esc(o.title||'')}</span></li>`).join('');
  return `<h3>Friends &amp; rivals</h3><ul class="kinlist">${li||'<li class="muted">No ties yet. Shipmates become Friends or Rivals on operations together.</li>'}</ul>`;

/* ---------- market: Black Tapestry's Armory, in Avelon's terms ----------
   Weapons and armor keep the Armory's five ranks, compressed to values: ranks 1 and 2 are +1, rank 3 is +2, ranks 4 and 5 are +3.
   Artifacts are carried in the Artifact slot, specialties in the Specialty slot, orbitals in the Ship support slot.
   Consumables are single-use and wait in the hold until an operation (Phase 2). */
const RANK_VAL=[1,1,2,3,3];
const W_PRICE=[4,7,13,18,23],A_PRICE=[4,8,13,19,24];
const PRICES={weapon:{},armor:{}};

A_TIERS.forEach((t,i)=>t.forEach(n=>{const v=n==='Nades R We Armor'?0:RANK_VAL[i];ARMORS.push([n,v]);PRICES.armor[n]=A_PRICE[i];ARMOR_RANK[n]=i+1}));
/* the Armory's special armors keep their flavor as an Avelon-style effect */
const ARMOR_FX={
  'Ad-Tier Chestpiece':{boon:'sponsor',d:'Sponsors: a free consumable lands in the hold each season'},
  'Branded Chestpiece':{boon:'sponsor',d:'Sponsors: a free consumable lands in the hold each season'},

  if(slot==='armor'){const v=aVal(n),fx=ARMOR_FX[n];return (v?'+'+v+' wound'+(v>1?'s':'')+' before going down':'')+(fx?(v?'. ':'')+fx.d:'')+' · rank '+(ARMOR_RANK[n]||'?')}

const fxH=m=>HEIRLOOMS[m.gear.heirloom]||{},fxS=m=>SPECIALTIES[m.gear.specialty]||{},fxA=m=>ARMOR_FX[m.gear.armor]||{};

const hasBoon=(m,b)=>!!m&&!m.dead&&(fxH(m).boon===b||fxS(m).boon===b||fxA(m).boon===b);
function boonTurn(say){
  living().forEach(m=>{
    if(m.captive&&hasBoon(m,'ransom')&&Math.random()<.5){const hn=m.captive.house;m.captive=null;say(`${m.given}'s ransom agent bribes the guards of the ${hn}. ${m.given} escapes and comes home.`,'good')}
  });
  const hd=living().find(m=>!m.captive&&hasBoon(m,'herald'));
  if(hd&&H.rivals){const top=H.rivals.filter(r=>r.hostility>0).sort((a,b)=>b.hostility-a.hostility)[0];
    if(top){top.hostility--;say(`${hd.given} stands a round for the ${top.name}. Their hostility falls to ${top.hostility}.`,'good')}}
}

function sponsorTurn(say){

    const n=pick(Object.keys(CONSUMABLES).filter(k=>CONSUMABLES[k].price<=6));H.armory.push({slot:'consumable',name:n});
    say(`${m.given}'s sponsors send a ${n} aboard.`,'good')});

/* bonus from gear to a roll of `stat`, during an operation of `type` (or none) */
function gearBonus(m,stat,type){
  const fx=[fxH(m),fxS(m),fxA(m)];let b=0;
  fx.forEach(f=>{if(f.stat===stat)b++;if(f.minus===stat)b--;if(type&&f.op===type)b++});
  return b;
}
function sellPrice(slot,n){const p=priceOf(slot,n);return p?Math.floor(p/2):0}
/* three pieces each season, each rolled +1 to +3, then a ware of that value (no repeats where possible) */
function smithStock(slot){
  const val=slot==='weapon'?wVal:aVal,pool=Object.keys(PRICES[slot]).filter(n=>val(n)>=1&&val(n)<=3),out=[];
  for(let i=0;i<3;i++){const v=1+Math.floor(Math.random()*3);let c=pool.filter(n=>val(n)===v&&!out.includes(n));if(!c.length)c=pool.filter(n=>!out.includes(n));if(c.length)out.push(pick(c))}
  return out.sort((a,b)=>val(a)-val(b)||PRICES[slot][a]-PRICES[slot][b]);
}

function artifactStock(){
  const com=shuffle(Object.keys(HEIRLOOMS).filter(n=>!HEIRLOOMS[n].unique)),uni=shuffle(Object.keys(HEIRLOOMS).filter(n=>HEIRLOOMS[n].unique));
  return Math.random()<.5?[com[0],com[1],uni[0]]:com.slice(0,3);
}
function ensureMarket(){

    H.market={cycle:H.cycle,weapon:smithStock('weapon'),armor:smithStock('armor'),heirloom:artifactStock(),specialty:shuffle(Object.keys(SPECIALTIES)).slice(0,4),
      support:shuffle(Object.keys(SUPPORT)).slice(0,3),consumable:shuffle(Object.keys(CONSUMABLES)).slice(0,6)};
  }
}
function buy(slot,n){
  const p=priceOf(slot,n);if(!p||H.gold<p)return;
  H.gold-=p;H.armory.push({slot,name:n});
  if(H.market[slot]&&slot!=='consumable'){const k=H.market[slot].indexOf(n);if(k>=0)H.market[slot].splice(k,1)}
  H.log.push({cycle:H.cycle,text:`Bought ${n} for ${p} credits.`});render();
}

/* put an item on a member; whatever they wore goes back to the hold */
function equip(m,slot,name){

  const old=m.gear[slot];
  if(name&&name!=='None'){const i=H.armory.findIndex(x=>x.slot===slot&&x.name===name);if(i<0)return;H.armory.splice(i,1)}
  if(old&&old!=='None')H.armory.push({slot,name:old});
  m.gear[slot]=name||(slot==='weapon'||slot==='armor'?'None':'');
  m.wounds=Math.min(m.wounds,maxWounds(m));
}
const valTag=(slot,n)=>slot==='weapon'?' (+'+wVal(n)+')':slot==='armor'?' (+'+aVal(n)+')':'';
function gearOptions(m,slot){
  const cur=m.gear[slot]||'',none=slot==='weapon'||slot==='armor'?'None':'';

/* how much an item helps this member: weapons and armor by value; the rest by their best stat and the operations that stat leads */
const ROLE_OPS={Accuracy:['Bounty','Dogfight'],Stature:['Bounty','Dogfight'],Endurance:['Bounty','Dogfight'],Cybernetics:['Salvage','Dogfight'],Proficiency:['Trade']};
function itemScore(m,slot,n){
  if(!n||n==='None')return 0;
  if(slot==='weapon')return wVal(n);
  if(slot==='armor')return aVal(n)+(ARMOR_FX[n]?1:0);
  if(slot==='support')return topStat(m.st)==='Cybernetics'?2:1;
  const i=itemInfo(slot,n);if(!i)return 0;
  const best=topStat(m.st),ops=ROLE_OPS[best];let sc=0;
  if(i.stat&&i.stat===best)sc+=2;
  if(i.minus&&i.minus===best)sc-=2;
  if(i.op&&ops.includes(i.op))sc+=2;
  if((i.wounds>0||i.fallGrit)&&['Accuracy','Stature','Endurance'].includes(best))sc+=2;
  if(i.taster)sc+=1;
  if(i.boon)sc+=1;
  return sc;
}
const improves=(m,slot,n)=>slot!=='consumable'&&(itemScore(m,slot,n)>itemScore(m,slot,m.gear[slot])||(!!(itemInfo(slot,n)||{}).boon&&m.gear[slot]!==n));

/* ---------- relations with each fleet ---------- */
const TENSION=['Friendly','Cool','Wary','Hostile','Bitter','Blood feud'];
const STRIKE_HOW={land:'move on your ships or send a hit squad',revenge:'send a hit squad',crown:'smear you to your clients',wealth:'raid your cargo'};
function guards(n){
  const g=[];if(atWar(n))return g;
  if(alliedWith(n))g.push('an alliance');
  H.dip.truces.filter(t=>t.house===n&&t.until>H.cycle).forEach(t=>g.push(`a truce until ${seasonOf(t.until)}, year ${yearOf(t.until)}`));
  H.pacts.filter(p=>p.house===n&&BINDING(p)).forEach(p=>g.push(p.kind.includes('coerced')?'a coerced truce':'a truce'));
  return g;
}
function tiesWith(n){
  const t=[];const add=(group,text,tone)=>t.push({group,text,tone:tone||''});
  const w=warWith(n);if(w)add('War',`At war since ${seasonOf(w.since)}, year ${yearOf(w.since)} · ${w.wins} won, ${w.losses} lost`,'bad');
  if(alliedWith(n))add('Deals','Alliance: each defends the other','good');
  H.dip.routes.filter(x=>x.house===n).forEach(x=>add('Cargo',`A ${x.size} contract on their lanes: ${routeActive(x)?`+${x.income} credits each season`:routeStatus(x)}`,routeActive(x)?'good':'warn'));
  if(H.dip.embargo.includes(n))add('Cargo','On your blacklist','bad');
  H.dip.embargoedBy.filter(x=>x.house===n).forEach(()=>add('Cargo','You are on their blacklist','bad'));
  H.dip.truces.filter(t=>t.house===n&&t.until>H.cycle).forEach(t=>add('Deals',`Truce until ${seasonOf(t.until)}, year ${yearOf(t.until)}`,'good'));
  H.dip.calls.filter(c=>c.from===n).forEach(c=>add('Deals',`They call you to arms against the ${c.against}`,'warn'));
  H.pacts.filter(p=>p.house===n).forEach(p=>add('Deals',p.kind+(p.dowered?' (signed)':'')+(p.income?` · +${p.income} credits each season`:''),'good'));
  H.members.filter(m=>!m.dead&&(m.origin==='recruit'||m.origin==='prisoner')&&m.from===n).forEach(m=>add('Crew',`${m.given} came aboard from them${m.origin==='prisoner'?' as a prisoner':''}`,m.origin==='prisoner'?'bad':'good'));
  H.members.filter(m=>m.givenTo===n).forEach(m=>add('Crew',`${m.given} transferred to them`,'good'));
  H.offers.filter(o=>o.house===n).forEach(()=>add('Crew','They offer recruits. Answer in Crew Ties.','warn'));
  H.dip.demands.filter(d=>d.house===n).forEach(()=>add('War','They have sent terms for peace. Answer this Perihelion.','warn'));
  const sec=H.secrets.filter(s=>s.house===n).length;if(sec)add('Leverage',`You hold ${sec} of their secret${sec>1?'s':''}`,'good');
  if(H.plans.some(p=>p.house===n))add('Leverage','You hold their patrol schedules','good');
  H.captives.filter(c=>c.house===n).forEach(c=>add('Prisoners',`You hold ${c.name}, ${c.rank}`,'good'));
  H.members.filter(m=>m.captive&&m.captive.house===n&&!m.dead).forEach(m=>add('Prisoners',`They hold ${m.given} of your crew`,'bad'));
  H.lands.filter(l=>l.from===n).forEach(l=>add('Ships',`You took ${l.name} from them`,'bad'));
  return t;
}
function stanceOf(r){
  if(atWar(r.name))return 'At war';
  if(alliedWith(r.name))return 'Allied';
  const g=guards(r.name);
  if(g.length&&r.hostility>=3)return 'Held in check';
  if(g.length)return 'At peace';
  if(r.hostility>=3)return 'Enemies';
  if(hasRoute(r.name))return 'Business partners';
  return r.hostility?'Uneasy':'Neutral';
}
function threatLine(r){
  if(atWar(r.name))return `<span class="hot">At war.</span> Each season their power clashes with yours${warAllies(r.name).length?' and your allies’':''}.`;
  const g=guards(r.name);
  if(g.length)return `<span class="okc">Will not strike at you</span> while ${g.join(', and ')}.`;
  if(!r.hostility)return 'No reason to strike at you yet.';
  return `<span class="hot">${r.hostility*6}% chance each season</span> they ${STRIKE_HOW[r.agenda]}.`;
}
function tensionMeter(r){return `<span class="tension t${r.hostility}"><span class="host" aria-hidden="true">${Array.from({length:5},(_,i)=>`<i class="${i<r.hostility?'on':''}"></i>`).join('')}</span><b>${TENSION[r.hostility]}</b></span>`}
function relationsOverview(){
  return `<div class="tablewrap"><table class="rel"><thead><tr><th scope="col">Fleet</th><th scope="col">Stance</th><th scope="col">Tension</th><th scope="col">Ties</th><th scope="col">Threat</th></tr></thead><tbody>${H.rivals.map(r=>{
    const t=tiesWith(r.name),groups=[...new Set(t.map(x=>x.group))];
    return `<tr><th scope="row"><span class="relname"><i class="kdot" style="background:${KIND_COLOR[r.kind]}"></i>${esc(r.name)}</span></th>
      <td>${stanceOf(r)}</td><td>${tensionMeter(r)}</td>
      <td>${groups.length?groups.map(gr=>`<span class="chip">${gr}${t.filter(x=>x.group===gr).length>1?' ×'+t.filter(x=>x.group===gr).length:''}</span>`).join(''):'<span class="muted">None</span>'}</td>
      <td>${atWar(r.name)?'<span class="hot">At war</span>':guards(r.name).length?'<span class="okc">Held in check</span>':r.hostility?`<span class="hot">${r.hostility*6}% a season</span>`:'<span class="muted">None</span>'}</td></tr>`}).join('')}</tbody></table></div>`;
}
/* rerolling a rival: only a fleet with no ties to yours, so nothing in your log points at it */
function rerollBlock(r){
  if(tiesWith(r.name).length)return 'Tied to your fleet. Only a fleet with no ties can be rerolled';
  if(H.ops.underway.some(x=>x.op.target===r.name)||(H.ops.defense||[]).some(d=>d.target===r.name))return 'An operation involving them is underway';
  return null;
}
function rerollHouse(n){
  const r=rival(n);if(!r||rerollBlock(r))return;replaceHouse(r);
}
function replaceHouse(r){
  const n=r.name,taken=new Set([H.house.name].concat(H.rivals.map(x=>x.name)));
  const nr=newRival(pick(Object.keys(RIVAL_KINDS)),taken);
  H.realm.alliances=H.realm.alliances.filter(k=>!k.split('|').includes(n));H.realm.wars=H.realm.wars.filter(k=>!k.split('|').includes(n));

  H.ops.board.forEach(o=>{if(o.target===n){o.target=r.name;o.title=o.title.split(n).join(r.name)}});
  if(leverage===n)leverage=null;if(houseMsg&&houseMsg.key===n)houseMsg=null;

function houseCard(r){
  const rels=H.rivals.filter(o=>o!==r&&relation(r.name,o.name)).map(o=>`<span class="${relation(r.name,o.name)==='war'?'hot':'okc'}">${relation(r.name,o.name)==='war'?'at war with':'allied with'} the ${esc(o.name)}</span>`).join(' · ');
  const secrets=H.secrets.map((s,i)=>[s,i]).filter(([s])=>s.house===r.name);
  const lev=leverage===r.name;
  const secretHtml=secrets.length?`<div class="secrets">${lev?secrets.map(([s,i])=>`<div class="sec"><p style="margin:0">${esc(s.text)}.</p><div class="acts"><button class="sm" data-bm="${i}|gold">Blackmail for credits</button><button class="sm" data-bm="${i}|peace">… for a truce</button>${PHASE>=4&&!H.offers.some(o=>o.house===r.name)?`<button class="sm" data-bm="${i}|match">… for recruits</button>`:''}<button class="sm danger" data-expose="${i}">Leak it</button></div></div>`).join('')+`<button class="sm" data-lev="">Close</button>`:`<button class="sm" data-lev="${esc(r.name)}">Use a secret (${secrets.length})</button>`}</div>`:'';
  const ties=tiesWith(r.name),groups=[...new Set(ties.map(x=>x.group))];
  const tieHtml=groups.length?groups.map(gr=>`<dt>${gr}</dt><dd><ul class="ties">${ties.filter(x=>x.group===gr).map(x=>`<li class="${x.tone}">${esc(x.text)}</li>`).join('')}</ul></dd>`).join(''):'';
  const hist=H.log.filter(l=>l.text.includes(r.name)).slice(-3).reverse();
