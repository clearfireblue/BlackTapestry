    <div class="stance"><span class="eyebrow" style="color:var(--gold)">${stanceOf(r)}</span>${tensionMeter(r)}</div>
    <p class="threat">${threatLine(r)}</p>
    <dl class="opdl">${tieHtml||'<dt>Ties</dt><dd class="muted">None yet. Trade, truces and leverage all tie fleets together.</dd>'}</dl>
    <dl class="opdl theirs"><dt>Agenda</dt><dd>${AGENDAS[r.agenda]}</dd><dt>Power</dt><dd>${'◆'.repeat(r.power)}${'◇'.repeat(3-r.power)} · ${r.lands} ship${r.lands===1?'':'s'}</dd>${rels?`<dt>Sector</dt><dd>${rels}</dd>`:''}</dl>

}

window.addEventListener('resize',()=>{try{fitNames()}catch(e){}});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='hname')fitArea(e.target,22);else if(e.target&&e.target.matches&&e.target.matches('input.hedit.nm'))fitInput(e.target,12);
  const t=e.target,m=H&&mem(sel);
  if(t.dataset.edit&&m){m[t.dataset.edit]=t.value;const b=document.querySelector(`ul.roster button[data-sel="${m.id}"]`);if(b){b.querySelector('.rn').textContent=m.given;}save();return}
  if(t.dataset.gear&&m&&t.tagName==='TEXTAREA'){m.gear[t.dataset.gear]=t.value;save();return}
});
document.addEventListener('change',e=>{
  const t=e.target,m=H&&mem(sel);
  if(t.dataset.hname!=null){tryRenameHouse(t.dataset.hname,t.value,t.dataset.hname);render();return}
  if(t.dataset.hseat!=null){const r=rival(t.dataset.hseat);if(r){const v=t.value.replace(/^(base|home port):\s*/i,'').trim().slice(0,48);if(v)r.seat=v}render();return}
  if(t.dataset.gear&&m&&t.tagName==='SELECT'){equip(m,t.dataset.gear,t.value);render();return}
  if(t.dataset.rename){renameSlot(t.dataset.rename,t.value);return}
  if(t.dataset.xfer){xferPick[t.dataset.xfer]=+t.value;render();return}
  if(t.dataset.edit){render();return}
  if(t.id==='hname'){H.house.ship=t.value.replace(/^\s*the\s+/i,'').replace(/\s+/g,' ').trim().slice(0,40)||H.house.ship;render()}
  if(t.id==='hwords'){H.house.words=t.value.replace(/[“”"]/g,'').trim()||H.house.words;render()}
  if(t.id==='hseat'){H.house.seat=t.value.replace(/^\s*home port:\s*/i,'').trim().slice(0,40)||H.house.seat;render()}
});

/* ---------- chain of command: drag a crew member onto another department ---------- */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;dragId=+c.dataset.drag;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',String(dragId));e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging,.dept.over').forEach(el=>el.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const d=dragId!=null&&e.target.closest&&e.target.closest('[data-dept]');if(!d)return;e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.dept.over').forEach(el=>{if(el!==d)el.classList.remove('over')});d.classList.add('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('[data-dept]');if(!d||dragId==null)return;e.preventDefault();
  const id=dragId;dragId=null;moveToDept(id,d.dataset.dept)});
function moveToDept(id,k){
  const m=mem(id);if(!m||m.dead||deptOf(m)===k){render();return}
  const L=(DEPTS.find(x=>x[0]===k)||[])[1]||k;m.dept=k;H.log.push({cycle:H.cycle,text:`${m.given} moves to ${L}.`});render();
}
/* touch: press and hold a crew card, then drag it onto a department. A quick tap still opens the dossier */
let tDrag=null,tSuppressClick=false;
const tEnd=()=>{if(!tDrag)return;clearTimeout(tDrag.timer);if(tDrag.ghost)tDrag.ghost.remove();if(tDrag.card)tDrag.card.classList.remove('dragging');document.querySelectorAll('.dept.over').forEach(el=>el.classList.remove('over'));tDrag=null};
const tDeptAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('[data-dept]'):null};
document.addEventListener('touchstart',e=>{
  const c=e.target.closest&&e.target.closest('[data-drag]');if(!c||e.touches.length!==1)return;
  const t=e.touches[0];tEnd();
  tDrag={id:+c.dataset.drag,card:c,x:t.clientX,y:t.clientY,active:false,ghost:null,
    timer:setTimeout(()=>{if(!tDrag)return;tDrag.active=true;c.classList.add('dragging');
      const r=c.getBoundingClientRect(),g=c.cloneNode(true);g.removeAttribute('data-sel');g.removeAttribute('data-drag');g.className='ccard tghost';
      g.style.width=r.width+'px';tDrag.dx=tDrag.x-r.left;tDrag.dy=tDrag.y-r.top;g.style.left=r.left+'px';g.style.top=r.top+'px';document.body.appendChild(g);tDrag.ghost=g;
      try{navigator.vibrate&&navigator.vibrate(15)}catch(x){}},300)};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!tDrag)return;const t=e.touches[0];
  if(!tDrag.active){if(Math.hypot(t.clientX-tDrag.x,t.clientY-tDrag.y)>10)tEnd();return}
  e.preventDefault();
  tDrag.ghost.style.left=(t.clientX-tDrag.dx)+'px';tDrag.ghost.style.top=(t.clientY-tDrag.dy)+'px';
  const d=tDeptAt(t.clientX,t.clientY);document.querySelectorAll('.dept.over').forEach(el=>{if(el!==d)el.classList.remove('over')});if(d)d.classList.add('over');
  /* scroll the page when the finger nears the top or bottom edge */
  const edge=60;if(t.clientY<edge)window.scrollBy(0,-12);else if(t.clientY>window.innerHeight-edge)window.scrollBy(0,12);
},{passive:false});
document.addEventListener('touchend',e=>{
  if(!tDrag)return;const was=tDrag.active,id=tDrag.id,t=e.changedTouches[0];
  const d=was&&t?tDeptAt(t.clientX,t.clientY):null;tEnd();
  if(was){tSuppressClick=true;setTimeout(()=>{tSuppressClick=false},400);if(e.cancelable)e.preventDefault();if(d)moveToDept(id,d.dataset.dept)}
});
document.addEventListener('touchcancel',tEnd);
document.addEventListener('contextmenu',e=>{if(tDrag&&e.target.closest&&e.target.closest('[data-drag]'))e.preventDefault()});
document.addEventListener('click',e=>{if(tSuppressClick){e.stopPropagation();e.preventDefault();tSuppressClick=false}},true);

/* ---------- start ---------- */
function start(d){
  if(d&&d.H){H=d.H;sel=d.sel||0;section=d.section||'house';activeSlot=d.activeSlot||readMeta().active}
  else if(!load()){H=generate((Math.random()*4294967295)>>>0);sel=H.members.find(m=>m.ruler).id}
  ensureState();
  render();
}
try{window.claude?.hot?.snapshot(()=>({H,sel,section,activeSlot}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
